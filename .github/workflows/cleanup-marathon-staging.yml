name: Cleanup marathon route staging

on:
  push:
    branches:
      - agent/full-source-marathon-batch-2026-08
    paths:
      - .github/workflows/cleanup-marathon-staging.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove temporary transfer machinery
        run: |
          rm -rf .route-staging
          rm -f .github/workflows/materialize-marathon-batch.yml
          rm -f .github/workflows/cleanup-marathon-staging.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .route-staging .github/workflows/materialize-marathon-batch.yml .github/workflows/cleanup-marathon-staging.yml
          git commit -m "Remove temporary marathon route staging"
          git push origin "HEAD:${GITHUB_REF_NAME}"
