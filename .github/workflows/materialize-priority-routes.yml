name: Materialize priority full-source routes

on:
  push:
    branches:
      - agent/full-source-priority-routes-2026-08
    paths:
      - .github/workflows/materialize-priority-routes.yml

permissions:
  contents: write

concurrency:
  group: materialize-priority-routes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Assemble checksum-verified route artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json

          manifest_path = Path('.route-staging/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('schemaVersion') != 1:
              raise SystemExit('Unsupported staging manifest schema')
          if manifest.get('compression') != 'gzip' or manifest.get('encoding') != 'base64':
              raise SystemExit('Unexpected staging encoding')

          outputs = []
          for item in manifest.get('routes', []):
              encoded = ''.join(
                  Path(chunk).read_text(encoding='utf-8').strip()
                  for chunk in item['chunks']
              )
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              if len(raw) != item['bytes']:
                  raise SystemExit(
                      f"{item['output']}: byte count {len(raw)} != expected {item['bytes']}"
                  )
              actual_sha = hashlib.sha256(raw).hexdigest()
              if actual_sha != item['sha256']:
                  raise SystemExit(
                      f"{item['output']}: SHA-256 {actual_sha} != expected {item['sha256']}"
                  )
              payload = json.loads(raw)
              if payload.get('sampling') != 'full-source-track-gap-split-180m':
                  raise SystemExit(f"{item['output']}: unexpected sampling metadata")
              path = Path(item['output'])
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              outputs.append(item['output'])
              print(f"Verified {item['output']}: {len(raw):,} bytes, SHA-256 {actual_sha}")

          catalog_path = Path('data/route-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          files = list(catalog.get('polylineFiles', []))
          for output in outputs:
              if output not in files:
                  files.append(output)
          catalog['polylineFiles'] = files
          catalog['updatedOn'] = '2026-08-17'
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Rebuild publication artifacts
        run: npm run build:publish

      - name: Advance route-detail quality floor
        run: npm run update:route-detail-quality-floor

      - name: Assert prioritized routes resolve to full source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json', 'utf8'));
          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json', 'utf8'));
          const expected = {
            'clingmans-dome': ['data/strava-route-full-resolution-clingmans-dome.json', 'strava-5301627345'],
            'nordic-day-2023-01-28': ['data/strava-route-full-resolution-frisco-nordic-2023-01-28.json', 'activity-nordic-day-2023-01-28'],
            'nordic-day-2023-01-08': ['data/strava-route-full-resolution-breckenridge-nordic-2023-01-08.json', 'activity-nordic-day-2023-01-08'],
            'nordic-day-2023-01-11': ['data/strava-route-full-resolution-breckenridge-nordic-2023-01-11.json', 'activity-nordic-day-2023-01-11'],
            'nordic-day-2023-01-21': ['data/strava-route-full-resolution-breckenridge-nordic-2023-01-21.json', 'activity-nordic-day-2023-01-21'],
            'haleakala': ['data/strava-route-full-resolution-haleakala.json', 'strava-4854788986'],
          };

          for (const [recordId, [file, featureId]] of Object.entries(expected)) {
            const entry = index.records?.[recordId];
            if (!entry) throw new Error(`${recordId}: missing from route-detail index`);
            if (entry.file !== file) throw new Error(`${recordId}: selected ${entry.file}, expected ${file}`);
            if (entry.featureId !== featureId) throw new Error(`${recordId}: selected ${entry.featureId}, expected ${featureId}`);
            if (entry.quality !== 'full-source') throw new Error(`${recordId}: quality ${entry.quality}, expected full-source`);
            if (floor.records?.[recordId] !== 'full-source') throw new Error(`${recordId}: quality floor was not promoted`);
            console.log(`${recordId}: ${featureId} -> ${file} [full-source]`);
          }
          NODE

      - name: Run fast repository validation
        run: npm run check:fast

      - name: Commit assembled production data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No production data changes to commit."
            exit 0
          fi
          git commit -m "Add prioritized full-source route detail"
          git push origin "HEAD:${GITHUB_REF_NAME}"
