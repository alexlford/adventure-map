name: Repair Stagecoach full-source payload tail

on:
  push:
    branches:
      - gps/full-source-stagecoach-2026-08-22
    paths:
      - '.github/workflows/repair-stagecoach-full-source-tail.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: gps/full-source-stagecoach-2026-08-22
          fetch-depth: 0
      - name: Restore missing encoded tail
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/strava-route-full-resolution-stagecoach-classic-15k-2024.json')
          data = json.loads(path.read_text())
          route = data['routes'][0]
          line = route['lines'][0]

          def decoded_count(encoded):
              i = 0
              count = 0
              while i < len(encoded):
                  for _ in range(2):
                      while True:
                          if i >= len(encoded):
                              raise SystemExit('Encoded line ends mid-coordinate')
                          b = ord(encoded[i]) - 63
                          i += 1
                          if b < 0x20:
                              break
                  count += 1
              return count

          before = decoded_count(line)
          if before != 5374:
              raise SystemExit(f'Unexpected pre-repair decoded count: {before}')

          suffix = '''A@A?C?A?C?A?C@A?A@A?A?A?A?A@A?A@A?C???C@A?A?A@C@A?C@C@A@EBA@A@A@C?A??BC@C??@C@C@?@A@C@A?A@?BC@A@A?A@A@C@C@C@A@CB?@C@CBC??@C@A?C@A@C@C@?B?@C@CDABCBAB?BCBABAFAB?BADAB?DAB?B@BA@?B?B?B@B?B?D?F@D@D?D@@AB?B?D?D?B?BAFAFAFA@?@ADC@AB?BCBA@ABABCDCBCDE@CBCDEBEDEBEBC@ABCBA?CBG@C?E@E@G?G?IBGBGBGBGBGBG@G?EACAEAECCACCAAACCEACCCCEAA?CCECEACAEAEACCECCACCGACCEAE?ECAAEAA?CCEAC?CCEAEACACCEACACACAEACCE?CCCAE?AACACACAC?A?AACAC?CAA?A?CAC?C?AACAAAC?A?CAAAC?C?AAC?CAC?A?AAC?A?CAAAA?AAA?CAC?CAA?CAAAC?AACAA?CAA?CAA?CAAEC?AACAAAC?ACAACAC?A?CACAC?CAC?CACCE?AAE?E@AAAAEAA?CAC?A?C?CAA?C?AAC?C?CAC?AAA@C?AAAACAC?AAC@A?C?C?CAACC?C?C?C?AAEAC?AAC?ECA?CAC?A?CAC?A?CAA?CACACAAACAC?C?E?CAAAC?A?CAC?CCC?A?CDEA?AC?E?C?EAA?E?C@C?A??AEAA?A?C?CA??CAE?A?AAC@CAC?C?CAA@A@A?EAAAC?CAC???CAAAAACAAA??A?AAC?A?CAA?CAA?A?G?AAC?C???CACACCACA@E?C?A@AAA?CACCC?A?A@AAAAE?CCCACAA?A?ACAACA?C???CCCAAAAACAA@CCE?E?AACAA???C?ACA?C?CAA?C?A@C@A?A?A@C@C@A@A@C?CBC?A@A@C?A?C@A?C?C???A@C@C?A@A@A@A@AB?DAF?H?HAJCLCLEJGLGLGJGHEHGJGJIJGHEJEJCJCJAJCLAJALAJCJALALALENCNENENELENEPGNENEPGNGLINIJIFIHA?BGBAAB?BC?@A?@?@??@?A@??A@A@A?????@?A????@@AA?@@??????A???A@??A@C@A?A@CBA@CBCBCDEDGFGFEDGDGFEBGDGDKBGDE@CDGBGBG?CBG?I?E@E?C???E@A?ABC@C@A?C@ABC@C?A@A@C@EDABGDCDEDEJEHEHGFEFGBEDGBEBE@A@C?CBC?C@A?C@C?C@A?C?A@E?A@CBGBCBEBCBCBC@C@CBCBA@CBC@?BCBABC?ABCBC@A@CBAFC@?BE@CFCBC?C@E@?@CBE@CDA@E@CBE@A?ABEBC?C?E@C?C@C?CBC?A@C?GBA?A@E@A@C?C@E?C?C?C@A?E?CA??E?CAEAAACACAA?CCAEAAAACECA??AACCCAAAAAAECACAACE?CCA?CCC?CCC?ECAAAAEACCACAACCAACCCA?AEACEACCAAC?ACC?ACCAAACCAAC?CCCAEAEAAECCC?CCCCCACAACCAEACEEAACCCCCAAACACAACCAEAAAA?C@CBCDCFAFCJAHEHCHEHCJCJ@L@LBJDFBFDDBH@D?F?F@F?FBD@DDDBBBBBBDBDD@DBBBDBF@D?F?F?J@J@L@L?N?PAP?P?RAR?R?TAR?P?R?P@P@N@PBNDJDJDJDJDJBDFDFN@FBBBFBHBD@FBB@F@@DFDFBH?FDDBFDF@FDFBH@FDFBF@HDFBHBFDJBFDHBHBHDHBHBHDH?FDHFJBFBHDF@BBFBD@B?B@B@BBB@B@@?B@B@B@D?@@B?B@B?B@B?D?B@B?FA@@D?F?B?D?F?@@DAH?B?DAD?B@D?DAD@DAB?F?F?B?D?D@D@D?B?D?F@B@D?DBD?D@BBD?DBB?DBB@FBDBBBBDDD@BBD?DBD@F@D@F@DBD?B@@?@?@?B@@?B?B?@@BAB?B?@?BABAB?BAD?B?BAB?BADAB@F?H?F?H?D@HAF?D@HAH@F@FAF@HAJ?DBFAHAB@H?HAF@HAD?H?H@HAJ?DAD?F?@?B?BAD@@?B?B?B?@A@?B?@?@?B?B?BA@?BAD?B?@A@?B?D?BAB?@?DAB?@?FAB?B?@AD?DA@@BADA@@B?BAD?B?@@D?@?BB?@?B?B@B?BADAF?DABAF?DADAF?HAB?D?HA@?F@H?F@H@JAB@F?JCD?FAFAFCHCDCHCDCHGFE@EDG@CDGDEDEBC@ADABCBC@CDABABC@C@CBCDC@CBC@C@E@C@C@G@A?C@E@C?C?C@E@CCCBE@CAC@E@EAC@C?EBG@C@GDEFEFCFCFEDCFEHEBGDKDI?KHMFGDIHKHE@EDABA?EBA@C@A@A@CBABA@CBABA@CDA@ABADA?CD?BABA@ABADABCDCDAD?DAFAF?F?J@J?P?PCPGNEFENCJAJAHCJCHAHCFCDA@EBA@A@ABC@A?A@A@A?A@C@A@C@A@A@A@A@C@A@C@A@C@A@C@?@C@A@C@A@A?ABA?C@A@ABC@A@A?ABC@A@C@A@A?A@C@C?A@A?A@A@A@A@ABA@ABC@ABADADADADADADADAFADADAFABCDAFADCDABCDCDCDEBCDEDEBGBG@E?ECCCAAAACAA?C?CAEAC?EAC?C@G?EAC@E@E@C?E@C?A?E@E?A?C@E@??E?E@A?C@E@A@CAG@A@C@CAA?E@A@A@ADCDAF@JBJBHBFBH@HBHBJ@FBJBHBJDJDJDLFJDJDJBLDJBJDJBHDJ@LBFBFBHBH@DDDDHDJ?JBF@F@F?D@F@F@D@F?D@D@B@F?F??@D@D?D@@@D?D?B@B@D?@@D?B?D?BADA@ABC@?BCBABCDCDABCDCDC?AFE?CDC@C@EBE@C@EBE?CDEBCACDEDE?CDE?ADEBE@CDE?ADCBCBCBC@CDEBC@ADC@CBABCBA@CBABABE@CBADGBABADGBABABEBABEDCBABABEBCBADEBABABEDCB?DEBABABCBABABEB?BADCBABCDADABADCB?FCFCD?DADAB?DCF?D@DCB?D?FCDAB@FCD?F?FAB?D@BAFAB@FCF@D?FAD?D@D?F@B@BBD@D?BBFBF?D?D?D@B?B@@?B?@@D@D?D?B?DBF@H?B?F@D@F@F@B@HAD@@@B?@?@@B?B?@????A??@????@@A@?A@??@?????A?????????????AA@@???A???@???A?@???A@'''
          route['lines'][0] = line + suffix
          after = decoded_count(route['lines'][0])
          if after != 6972:
              raise SystemExit(f'Unexpected post-repair decoded count: {after}')
          if route.get('sourcePointCount') != 6972 or route.get('retainedPointCount') != 6972:
              raise SystemExit('Stagecoach source/retained metadata does not match 6,972 points')
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n')
          print(f'Restored Stagecoach encoded route: {before} -> {after} decoded coordinates')
          PY
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate compiled route contract
        run: |
          node scripts/validate-source-rdp-routes.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          npm run validate:all
      - name: Commit repaired payload
        run: |
          git checkout -- scripts/__pycache__ 2>/dev/null || true
          git rm .github/workflows/repair-stagecoach-full-source-tail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava-route-full-resolution-stagecoach-classic-15k-2024.json
          git commit -m "Restore complete Stagecoach GPS payload"
          git push origin HEAD:gps/full-source-stagecoach-2026-08-22
