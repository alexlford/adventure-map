name: Materialize Nordic Day 2022-02-16 full-source route

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reconstruct and verify Nordic full-source payload
        run: |
          cat tmp/nordic-2022-02-16-gz.part00.b64 \
              tmp/nordic-2022-02-16-gz.part01.b64 \
              tmp/nordic-2022-02-16-gz.part02.b64 \
              tmp/nordic-2022-02-16-gz.part03.b64 > tmp/nordic-2022-02-16.json.gz.b64
          base64 --decode tmp/nordic-2022-02-16.json.gz.b64 > tmp/nordic-2022-02-16.json.gz
          echo 'f4f593bdfea058394e865fb50e561e9341a1f83e48adbcdc181794a8ff072349  tmp/nordic-2022-02-16.json.gz' | sha256sum --check --strict
          gzip --decompress --stdout tmp/nordic-2022-02-16.json.gz > data/strava-route-full-resolution-nordic-day-2022-02-16.json
          echo '1cfdf8c0ae88d6dd831023da7cce1b0b90526ec743626d84bedef511bfe7817c  data/strava-route-full-resolution-nordic-day-2022-02-16.json' | sha256sum --check --strict
          test "$(git hash-object data/strava-route-full-resolution-nordic-day-2022-02-16.json)" = 'b00a30aa5dec360f5604468560ea0cd480dba1a5'
      - name: Register route and rebuild route detail index
        run: |
          python - <<'PYREG'
          import json
          from pathlib import Path
          catalog_path=Path('data/route-catalog.json'); catalog=json.loads(catalog_path.read_text())
          new_file='data/strava-route-full-resolution-nordic-day-2022-02-16.json'; anchor='data/strava-route-full-resolution-nordic-day-2022-01-22.json'; files=catalog['polylineFiles']
          if new_file not in files: files.insert(files.index(anchor)+1,new_file)
          dense=catalog['qualityExpectations']['denseRoutes']
          if not any(item.get('id')=='activity-nordic-day-2022-02-16' for item in dense): dense.append({'id':'activity-nordic-day-2022-02-16','minPoints':3260,'resolutionPrefix':'full-source-track'})
          catalog['updatedOn']='2026-08-22'; catalog_path.write_text(json.dumps(catalog,indent=2)+'\n')
          floor_path=Path('data/route-detail-quality-floor.json'); floor=json.loads(floor_path.read_text())
          prior=floor['records'].get('nordic-day-2022-02-16')
          if prior not in ('rdp-3m','full-source'): raise SystemExit(f'unexpected quality floor: {prior}')
          floor['records']['nordic-day-2022-02-16']='full-source'; floor_path.write_text(json.dumps(floor,indent=2)+'\n')
          PYREG
          node scripts/build-route-detail-index.mjs --write
      - name: Verify full-source selection and exact geometry
        run: |
          python - <<'PYVERIFY'
          import json
          from pathlib import Path
          route_file='data/strava-route-full-resolution-nordic-day-2022-02-16.json'; payload=json.loads(Path(route_file).read_text()); route=payload['routes'][0]
          assert payload['sampling']=='full-source-track-gap-split-180m'; assert route['id']=='activity-nordic-day-2022-02-16'
          assert route['stravaActivityIds']==['6693503186']; assert route['sourceFiles']==['activities/6693503186.gpx']
          assert route['sourcePointCount']==3299 and route['sourcePointCounts']==[3299] and route['retainedPointCount']==3299 and len(route['lines'])==1
          def count(line):
              i=c=0
              while i<len(line):
                  for _ in range(2):
                      while True:
                          b=ord(line[i])-63; i+=1
                          if b<0x20: break
                  c+=1
              return c
          assert count(route['lines'][0])==3299
          rec=json.loads(Path('data/route-detail-index.json').read_text())['records']['nordic-day-2022-02-16']
          assert rec['file']==route_file and rec['featureId']=='activity-nordic-day-2022-02-16' and rec['quality']=='full-source'
          PYVERIFY
      - name: Run route validators
        run: |
          node scripts/validate-route-geometry-policy.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          node scripts/validate-source-rdp-routes.mjs
          npm run validate:route-detail-index
          npm run test:route-quality-floor
      - name: Commit materialized route only
        run: |
          rm -f tmp/public-routes.geojson tmp/nordic-2022-02-16.json.gz.b64 tmp/nordic-2022-02-16.json.gz
          rm -f .github/workflows/materialize-nordic-day-2022-02-16.yml
          rm -f tmp/nordic-2022-02-16-gz.part00.b64 tmp/nordic-2022-02-16-gz.part01.b64 tmp/nordic-2022-02-16-gz.part02.b64 tmp/nordic-2022-02-16-gz.part03.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava-route-full-resolution-nordic-day-2022-02-16.json data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git add -u .github/workflows/materialize-nordic-day-2022-02-16.yml tmp/nordic-2022-02-16-gz.part00.b64 tmp/nordic-2022-02-16-gz.part01.b64 tmp/nordic-2022-02-16-gz.part02.b64 tmp/nordic-2022-02-16-gz.part03.b64
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Nordic Day 2022-02-16 full-source route"
          git push origin HEAD:${{ github.head_ref }}
