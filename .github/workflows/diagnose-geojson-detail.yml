name: Diagnose GeoJSON route detail

on:
  push:
    branches:
      - agent/route-detail-2
    paths:
      - .github/workflows/diagnose-geojson-detail.yml
      - tests/geojson-route-detail.spec.mjs
      - route-catalog.js
      - data/route-detail-index.json

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run focused route detail test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/adventures-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && break; sleep .25; done
          npx playwright test tests/geojson-route-detail.spec.mjs --project=chromium --retries=0 --reporter=line
