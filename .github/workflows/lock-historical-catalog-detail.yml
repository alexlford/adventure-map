name: Lock historical catalog-detail contract

on:
  push:
    branches:
      - quality/lock-historical-catalog-detail-2026-08-25
    paths:
      - .github/workflows/lock-historical-catalog-detail.yml

permissions:
  contents: write

jobs:
  lock-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Register historical proxies and enforce exact catalog-detail policy
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          historical = [
              'river-to-river-relay-2006',
              'river-to-river-relay-2008',
              'river-to-river-relay-2010',
              'snowman-shuffle-2006',
              'snowman-shuffle-2007',
              'snowman-shuffle-2008',
              'snowman-shuffle-2009',
              'snowman-shuffle-series',
          ]

          catalog_path = Path('data/route-catalog.json')
          catalog = json.loads(catalog_path.read_text())
          quality = catalog.setdefault('qualityExpectations', {})
          quality['historicalCatalogDetailRecords'] = historical
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')

          audit_path = Path('scripts/audit-route-detail-coverage.mjs')
          text = audit_path.read_text()

          input_old = "const qualityFloor = readJson('data/route-detail-quality-floor.json');\nconst recordsPayload = readJson('data/public-records.json');"
          input_new = "const qualityFloor = readJson('data/route-detail-quality-floor.json');\nconst routeCatalog = readJson('data/route-catalog.json');\nconst recordsPayload = readJson('data/public-records.json');"
          if input_old not in text:
              raise SystemExit('Could not locate route-detail audit input block')
          text = text.replace(input_old, input_new, 1)

          policy_anchor = "const selectedFeatures = new Set();\n\nif (qualityFloor.schemaVersion !== 1) {"
          policy_lines = [
              "const selectedFeatures = new Set();",
              "const historicalCatalogDetailList = (routeCatalog.qualityExpectations?.historicalCatalogDetailRecords || []).map(String);",
              "const historicalCatalogDetailRecords = new Set(historicalCatalogDetailList);",
              "const catalogDetailRecords = new Set(",
              "  entries",
              "    .filter(([recordId, entry]) => recordsById.has(recordId) && entry?.quality === 'catalog-detail')",
              "    .map(([recordId]) => recordId),",
              ");",
              "const catalogDetailPolicyProblems = [];",
              "",
              "if (historicalCatalogDetailList.length !== historicalCatalogDetailRecords.size) {",
              "  catalogDetailPolicyProblems.push('historical catalog-detail registry contains duplicate record IDs');",
              "}",
              "for (const recordId of catalogDetailRecords) {",
              "  if (!historicalCatalogDetailRecords.has(recordId)) {",
              "    catalogDetailPolicyProblems.push(`${recordId}: catalog-detail is not registered as an intentional historical proxy`);",
              "  }",
              "}",
              "for (const recordId of historicalCatalogDetailRecords) {",
              "  if (!recordsById.has(recordId)) {",
              "    catalogDetailPolicyProblems.push(`${recordId}: historical catalog-detail registry entry is not a public record`);",
              "    continue;",
              "  }",
              "  const selected = index.records?.[recordId];",
              "  if (!selected) {",
              "    catalogDetailPolicyProblems.push(`${recordId}: historical catalog-detail registry entry has no route-detail selection`);",
              "  } else if (selected.quality !== 'catalog-detail') {",
              "    catalogDetailPolicyProblems.push(",
              "      `${recordId}: historical catalog-detail registry entry is stale; selected quality is ${selected.quality}`,",
              "    );",
              "  }",
              "}",
              "problems.push(...catalogDetailPolicyProblems);",
          ]
          policy_block = '\n'.join(policy_lines) + "\n\nif (qualityFloor.schemaVersion !== 1) {"
          if policy_anchor not in text:
              raise SystemExit('Could not locate route-detail audit policy insertion point')
          text = text.replace(policy_anchor, policy_block, 1)

          summary_old = "  qualityFloorViolations: floorAudit.violations.length,\n  quality: byQuality,"
          summary_new = "  qualityFloorViolations: floorAudit.violations.length,\n  historicalCatalogDetailRecords: historicalCatalogDetailRecords.size,\n  catalogDetailPolicyViolations: catalogDetailPolicyProblems.length,\n  quality: byQuality,"
          if summary_old not in text:
              raise SystemExit('Could not locate route-detail audit summary block')
          text = text.replace(summary_old, summary_new, 1)

          diagnostics_anchor = "if (floorAudit.violations.length) {\n  console.log('\\nQUALITY_FLOOR_VIOLATIONS');\n  for (const violation of floorAudit.violations) console.log(JSON.stringify(violation));\n}\n\nif (orphanEntries.length) {"
          diagnostics_lines = [
              "if (floorAudit.violations.length) {",
              "  console.log('\\nQUALITY_FLOOR_VIOLATIONS');",
              "  for (const violation of floorAudit.violations) console.log(JSON.stringify(violation));",
              "}",
              "",
              "if (catalogDetailPolicyProblems.length) {",
              "  console.log('\\nCATALOG_DETAIL_POLICY_VIOLATIONS');",
              "  for (const problem of catalogDetailPolicyProblems) console.log(JSON.stringify({ problem }));",
              "}",
              "",
              "if (orphanEntries.length) {",
          ]
          diagnostics_block = '\n'.join(diagnostics_lines)
          if diagnostics_anchor not in text:
              raise SystemExit('Could not locate route-detail audit diagnostics block')
          text = text.replace(diagnostics_anchor, diagnostics_block, 1)

          audit_path.write_text(text)
          print(f'Registered {len(historical)} historical catalog-detail proxies and updated permanent audit enforcement.')
          PY

      - name: Validate the permanent route-detail contract
        run: |
          npm run validate:route-detail-index
          npm run validate:route-detail-audit
          npm run validate:route-references
          npm run validate:data
          npm run test:route-quality-floor
          npm run test:route-selection

      - name: Prove unregistered and stale catalog-detail exceptions fail closed
        shell: bash
        run: |
          cp data/route-catalog.json /tmp/route-catalog.locked.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/route-catalog.json')
          payload = json.loads(path.read_text())
          records = payload['qualityExpectations']['historicalCatalogDetailRecords']
          removed = records.pop(0)
          path.write_text(json.dumps(payload, indent=2) + '\n')
          print(f'Removed {removed} to verify an unregistered catalog-detail record fails enforcement.')
          PY
          if npm run validate:route-detail-audit; then
            echo 'ERROR audit unexpectedly accepted an unregistered catalog-detail record'
            exit 1
          fi
          cp /tmp/route-catalog.locked.json data/route-catalog.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/route-catalog.json')
          payload = json.loads(path.read_text())
          payload['qualityExpectations']['historicalCatalogDetailRecords'].append('stale-historical-proxy-sentinel')
          path.write_text(json.dumps(payload, indent=2) + '\n')
          print('Added stale sentinel to verify unused historical exceptions fail enforcement.')
          PY
          if npm run validate:route-detail-audit; then
            echo 'ERROR audit unexpectedly accepted a stale historical catalog-detail exception'
            exit 1
          fi
          cp /tmp/route-catalog.locked.json data/route-catalog.json
          npm run validate:route-detail-audit

      - name: Commit only the permanent contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lock-historical-catalog-detail.yml
          git add data/route-catalog.json scripts/audit-route-detail-coverage.mjs
          echo "Final staged paths:"
          git diff --cached --name-only
          git commit -m "Lock historical catalog-detail route policy"
          git push
