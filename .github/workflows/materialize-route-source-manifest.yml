name: Materialize route source manifest

on:
  push:
    branches: [fix/high-resolution-routes-final-20260812]

permissions:
  contents: write

jobs:
  manifest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/high-resolution-routes-final-20260812
          fetch-depth: 0
      - name: Build route source manifest
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path('.')
          data = root / 'data'
          catalog = json.loads((data / 'route-catalog.json').read_text())
          rows = []
          seen = set()

          activity_days = json.loads((data / 'activity-days.json').read_text())
          for record in activity_days.get('adventures', []):
              ids = [str(v) for v in record.get('stravaActivityIds', [])]
              if not ids and record.get('stravaActivityId') is not None:
                  ids = [str(record['stravaActivityId'])]
              if not ids:
                  continue
              row = {
                  'routeId': f"activity-{record['id']}",
                  'adventureIds': [record['id']],
                  'stravaActivityIds': ids,
                  'category': 'mtb' if record.get('discipline') == 'mountain-bike' else record.get('discipline'),
                  'mtbMode': record.get('mtbMode'),
                  'sourceKind': 'activity-day',
              }
              rows.append(row)
              seen.add(row['routeId'])

          for rel in catalog.get('routeFiles', []):
              collection = json.loads((root / rel).read_text())
              for feature in collection.get('features', []):
                  fid = feature.get('id') or feature.get('properties', {}).get('featureId')
                  if not fid or not re.fullmatch(r'strava-\d+', str(fid)) or fid in seen:
                      continue
                  props = dict(feature.get('properties') or {})
                  activity_id = str(props.get('stravaActivityId') or str(fid)[7:])
                  override = catalog.get('featureOverrides', {}).get(str(fid), {})
                  adventure_ids = override.get('adventureIds', props.get('adventureIds', []))
                  row = {
                      'routeId': str(fid),
                      'adventureIds': [str(v) for v in adventure_ids],
                      'stravaActivityIds': [activity_id],
                      'category': props.get('category'),
                      'mtbMode': props.get('mtbMode'),
                      'sourceKind': 'canonical-strava-feature',
                  }
                  rows.append(row)
                  seen.add(str(fid))

          rows.sort(key=lambda r: (r['sourceKind'], r['routeId']))
          output = data / 'route-source-manifest.ndjson'
          output.write_text('\n'.join(json.dumps(row, separators=(',', ':')) for row in rows) + '\n')
          print(f'Wrote {len(rows)} mapped route sources to {output}.')
          PY
      - name: Commit manifest and retire helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/route-source-manifest.ndjson
          git rm .github/workflows/materialize-route-source-manifest.yml
          git commit -m 'Materialize current route source manifest'
          git push origin HEAD:fix/high-resolution-routes-final-20260812
