name: Accessibility gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build publication artifacts
        run: npm run build:publish
      - name: Validate accessibility contract
        run: npm run validate:accessibility-contract
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run accessibility regression gate
        run: npm run test:accessibility
      - name: Preserve accessibility failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
