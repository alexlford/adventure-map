name: Materialize MTB Day 2023-09-24 route

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fix temporary ignored-file staging boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-route-detail-index.mjs')
          text = path.read_text()
          old = """      ROUTE_PATH,\n      ...materializeChunks.map(name => `tmp/${name}`),\n      'scripts/build-route-detail-index.mjs',"""
          new = """      ROUTE_PATH,\n      'scripts/build-route-detail-index.mjs',"""
          if old not in text:
              raise SystemExit('Expected temporary MTB staging block not found')
          text = text.replace(old, new, 1)
          old2 = """    ], { cwd: ROOT, stdio: 'inherit' });\n    console.log('MTB Day 2023-09-24 final publication files are verified and staged; temporary scripts/chunks restored or removed.');"""
          new2 = """    ], { cwd: ROOT, stdio: 'inherit' });\n    execFileSync('git', ['add', '-u', '--', ...materializeChunks.map(name => `tmp/${name}`)], { cwd: ROOT, stdio: 'inherit' });\n    console.log('MTB Day 2023-09-24 final publication files are verified and staged; temporary scripts/chunks restored or removed.');"""
          if old2 not in text:
              raise SystemExit('Expected temporary MTB staging tail not found')
          path.write_text(text.replace(old2, new2, 1))
          PY
      - name: Materialize and verify route
        run: node scripts/build-route-detail-index.mjs --write
      - name: Commit final four-file publication diff
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-mtb-2023-09-24.yml
          git add -u .github/workflows/materialize-mtb-2023-09-24.yml
          expected="data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json data/strava-route-full-resolution-mtb-day-2023-09-24.json"
          actual="$(git diff --cached --name-only | grep '^data/' | sort | tr '\n' ' ' | sed 's/ $//')"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize MTB Day 2023-09-24 full-source route'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
