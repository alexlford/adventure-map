name: Finalize reviewed route quality v2

on:
  push:
    branches:
      - fix/reviewed-route-quality-v2-2026-08-24

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reviewed-route-quality-v2-2026-08-24
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate route quality artifacts
        run: |
          npm run build:route-detail-index
          npm run update:route-detail-quality-floor
      - name: Verify reviewed routes and current MTB promotion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json', 'utf8'));
          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json', 'utf8'));
          for (const id of ['midland-hill', 'mount-lamlam']) {
            if (index.records?.[id]?.quality !== 'reviewed-source') {
              throw new Error(`${id} index quality is ${index.records?.[id]?.quality}, expected reviewed-source`);
            }
            if (floor.records?.[id] !== 'reviewed-source') {
              throw new Error(`${id} floor quality is ${floor.records?.[id]}, expected reviewed-source`);
            }
          }
          if (floor.records?.['mtb-day-2025-07-11'] !== 'full-source') {
            throw new Error('MTB Day 2025-07-11 full-source floor was not preserved');
          }
          NODE
      - name: Run validation
        run: |
          npm run test:route-quality-floor
          npm run test:route-geometry-quality
          npm run validate:route-detail-index
          npm run validate:route-geometry
          npm run validate:route-references
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route-detail-index.json data/route-detail-quality-floor.json
          if git diff --cached --quiet; then
            echo "No generated artifact changes"
            exit 0
          fi
          git commit -m "Refresh reviewed route quality artifacts"
          git push origin HEAD:fix/reviewed-route-quality-v2-2026-08-24
