name: Materialize Nordic Day 2022-02-13 full-source route

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'gps/full-source-nordic-day-2022-02-13-2026-08-23'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Reconstruct and verify Nordic full-source payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          prefix = Path('tmp/nordic-2022-02-13-gz')
          parts = [Path(f'{prefix}.part{i:02d}.b64') for i in range(3)]
          encoded = ''.join(path.read_text() for path in parts)
          compressed = base64.b64decode(encoded)
          assert hashlib.sha256(compressed).hexdigest() == '01739aac2c59a902b5ed844d1a9ecfc7c1bacea87ad1dae6a258eaf889de9b96'
          raw = gzip.decompress(compressed)
          assert hashlib.sha256(raw).hexdigest() == '016b9c8b9118fc724c3b06682e2f9f49b4b702c9e036f8b1ba32a8605788e707'
          git_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          assert git_blob == 'c5cc9986f34b6e9c52d9b3abd038f5ab33a2be6a'

          payload = json.loads(raw)
          route = payload['routes'][0]
          assert route['id'] == 'activity-nordic-day-2022-02-13'
          assert route['stravaActivityIds'] == ['6679695204', '6679108113']
          assert route['sourcePointCounts'] == [1246, 631]
          assert route['sourcePointCount'] == 1877
          assert route['retainedPointCount'] == 1877
          assert len(route['lines']) == 2

          def point_count(line):
              index = 0
              values = 0
              while index < len(line):
                  while True:
                      value = ord(line[index]) - 63
                      index += 1
                      if value < 0x20:
                          break
                  values += 1
              assert values % 2 == 0
              return values // 2

          counts = [point_count(line) for line in route['lines']]
          assert counts == [1246, 631], counts

          Path('data/strava-route-full-resolution-nordic-day-2022-02-13.json').write_bytes(raw)
          print('Verified Nordic 2022-02-13 payload:', counts, 'points')
          PY

      - name: Register route and rebuild route detail index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('data/route-catalog.json')
          catalog = json.loads(path.read_text())
          route_file = 'data/strava-route-full-resolution-nordic-day-2022-02-13.json'
          if route_file not in catalog['polylineFiles']:
              before = 'data/strava-route-full-resolution-nordic-day-2022-02-16.json'
              index = catalog['polylineFiles'].index(before)
              catalog['polylineFiles'].insert(index, route_file)

          dense = catalog['qualityExpectations']['denseRoutes']
          route_id = 'activity-nordic-day-2022-02-13'
          if not any(item.get('id') == route_id for item in dense):
              dense.append({
                  'id': route_id,
                  'minPoints': 1840,
                  'resolutionPrefix': 'full-source-track'
              })

          path.write_text(json.dumps(catalog, indent=2) + '\n')
          PY
          node scripts/build-route-detail-index.mjs --write
          node scripts/update-route-detail-quality-floor.mjs

      - name: Verify full-source selection and exact geometry
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const route = JSON.parse(fs.readFileSync('data/strava-route-full-resolution-nordic-day-2022-02-13.json', 'utf8')).routes[0];
          if (route.sourcePointCount !== 1877 || route.retainedPointCount !== 1877 || route.lines.length !== 2) {
            throw new Error('Unexpected Nordic 2022-02-13 route payload');
          }

          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json', 'utf8'));
          const record = index.records['nordic-day-2022-02-13'];
          if (!record || record.file !== 'data/strava-route-full-resolution-nordic-day-2022-02-13.json' || record.quality !== 'full-source') {
            throw new Error(`Unexpected route-detail selection: ${JSON.stringify(record)}`);
          }

          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json', 'utf8'));
          if (floor.records['nordic-day-2022-02-13'] !== 'full-source') {
            throw new Error('Nordic 2022-02-13 quality floor did not advance');
          }

          const catalog = JSON.parse(fs.readFileSync('data/route-catalog.json', 'utf8'));
          const dense = catalog.qualityExpectations.denseRoutes.find(item => item.id === 'activity-nordic-day-2022-02-13');
          if (!dense || dense.minPoints !== 1840 || dense.resolutionPrefix !== 'full-source-track') {
            throw new Error(`Unexpected dense-route protection: ${JSON.stringify(dense)}`);
          }
          NODE

      - name: Run route validators
        run: |
          npm run validate:route-references
          npm run validate:route-geometry
          npm run validate:route-detail-index
          npm run validate:route-detail-audit
          npm run test:route-quality-floor

      - name: Commit materialized route only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f tmp/nordic-2022-02-13-gz.part*.b64
          rm -f .github/workflows/materialize-nordic-day-2022-02-13.yml
          git add data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json data/strava-route-full-resolution-nordic-day-2022-02-13.json
          git add -u tmp/nordic-2022-02-13-gz.part00.b64 tmp/nordic-2022-02-13-gz.part01.b64 tmp/nordic-2022-02-13-gz.part02.b64 .github/workflows/materialize-nordic-day-2022-02-13.yml
          git diff --cached --name-only
          git commit -m "Materialize Nordic Day 2022-02-13 full-source route"
          git push
