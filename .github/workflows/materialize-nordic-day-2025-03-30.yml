name: Materialize Nordic Day 2025-03-30 full-source route

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reconstruct and verify Nordic composite payload
        run: |
          cat tmp/nordic-2025-03-30-gz.part00.b64 \
              tmp/nordic-2025-03-30-gz.part01.b64 \
              tmp/nordic-2025-03-30-gz.part02.b64 \
              tmp/nordic-2025-03-30-gz.part03.b64 \
              tmp/nordic-2025-03-30-gz.part04.b64 \
              tmp/nordic-2025-03-30-gz.part05.b64 \
              tmp/nordic-2025-03-30-gz.part06.b64 \
              tmp/nordic-2025-03-30-gz.part07.b64 \
              tmp/nordic-2025-03-30-gz.part08.b64 \
              tmp/nordic-2025-03-30-gz.part09.b64 \
              tmp/nordic-2025-03-30-gz.part10.b64 > tmp/nordic-2025-03-30.json.gz.b64
          base64 --decode tmp/nordic-2025-03-30.json.gz.b64 > tmp/nordic-2025-03-30.json.gz
          echo '5885de785786ab616823307b8dd82fc77c22b70b5391682ca3e21e602128f0a4  tmp/nordic-2025-03-30.json.gz' | sha256sum --check --strict
          gzip --decompress --stdout tmp/nordic-2025-03-30.json.gz > data/strava-route-full-resolution-nordic-day-2025-03-30.json
          echo '511faf7a972e27c857885c34981f835770d4025b719fe6c6f9c51effd249ac96  data/strava-route-full-resolution-nordic-day-2025-03-30.json' | sha256sum --check --strict
          test "$(git hash-object data/strava-route-full-resolution-nordic-day-2025-03-30.json)" = '58b312611e4996252c4f6841a58fbf876c42c1df'
      - name: Register route and rebuild route detail index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog_path = Path('data/route-catalog.json')
          new_file = 'data/strava-route-full-resolution-nordic-day-2025-03-30.json'
          anchor = 'data/strava-route-full-resolution-nordic-day-2025-03-27.json'
          catalog = json.loads(catalog_path.read_text())
          files = catalog['polylineFiles']
          if new_file not in files:
              i = files.index(anchor) + 1
              files.insert(i, new_file)
          dense = catalog['qualityExpectations']['denseRoutes']
          if not any(item.get('id') == 'activity-nordic-day-2025-03-30' for item in dense):
              dense.append({'id':'activity-nordic-day-2025-03-30','minPoints':13350,'resolutionPrefix':'full-source-track'})
          catalog['updatedOn'] = '2026-08-22'
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')
          floor_path = Path('data/route-detail-quality-floor.json')
          floor = json.loads(floor_path.read_text())
          prior = floor['records'].get('nordic-day-2025-03-30')
          if prior not in ('rdp-3m','full-source'):
              raise SystemExit(f'unexpected Nordic Day quality floor: {prior}')
          floor['records']['nordic-day-2025-03-30'] = 'full-source'
          floor_path.write_text(json.dumps(floor, indent=2) + '\n')
          PY
          node scripts/build-route-detail-index.mjs --write
      - name: Verify composite full-source selection and exact geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          route_file='data/strava-route-full-resolution-nordic-day-2025-03-30.json'
          payload=json.loads(Path(route_file).read_text()); route=payload['routes'][0]
          assert payload['sampling']=='full-source-track-gap-split-180m'
          assert route['id']=='activity-nordic-day-2025-03-30'
          assert route['stravaActivityIds']==['14034041280','14033020733','14031420816']
          assert route['sourcePointCount']==13415
          assert route['sourcePointCounts']==[5815,5597,2003]
          assert route['retainedPointCount']==13415
          assert len(route['lines'])==3
          def count(line):
              i=n=0
              while i<len(line):
                  for _ in range(2):
                      while True:
                          b=ord(line[i])-63;i+=1
                          if b<0x20: break
                  n+=1
              return n
          counts=[count(line) for line in route['lines']]
          assert counts==[5815,5597,2003], counts
          index=json.loads(Path('data/route-detail-index.json').read_text())
          record=index['records']['nordic-day-2025-03-30']
          assert record['file']==route_file, record
          assert record['featureId']=='activity-nordic-day-2025-03-30', record
          assert record['quality']=='full-source', record
          PY
      - name: Run route validators
        run: |
          node scripts/validate-route-geometry-policy.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          node scripts/validate-source-rdp-routes.mjs
          npm run validate:route-detail-index
          npm run test:route-quality-floor
      - name: Commit materialized route only
        run: |
          rm -f tmp/public-routes.geojson tmp/nordic-2025-03-30.json.gz.b64 tmp/nordic-2025-03-30.json.gz
          rm -f .github/workflows/materialize-nordic-day-2025-03-30.yml
          rm -f tmp/nordic-2025-03-30-gz.part00.b64 tmp/nordic-2025-03-30-gz.part01.b64 \
                tmp/nordic-2025-03-30-gz.part02.b64 tmp/nordic-2025-03-30-gz.part03.b64 \
                tmp/nordic-2025-03-30-gz.part04.b64 tmp/nordic-2025-03-30-gz.part05.b64 \
                tmp/nordic-2025-03-30-gz.part06.b64 tmp/nordic-2025-03-30-gz.part07.b64 \
                tmp/nordic-2025-03-30-gz.part08.b64 tmp/nordic-2025-03-30-gz.part09.b64 \
                tmp/nordic-2025-03-30-gz.part10.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava-route-full-resolution-nordic-day-2025-03-30.json \
                  data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git add -u .github/workflows/materialize-nordic-day-2025-03-30.yml \
                     tmp/nordic-2025-03-30-gz.part00.b64 tmp/nordic-2025-03-30-gz.part01.b64 \
                     tmp/nordic-2025-03-30-gz.part02.b64 tmp/nordic-2025-03-30-gz.part03.b64 \
                     tmp/nordic-2025-03-30-gz.part04.b64 tmp/nordic-2025-03-30-gz.part05.b64 \
                     tmp/nordic-2025-03-30-gz.part06.b64 tmp/nordic-2025-03-30-gz.part07.b64 \
                     tmp/nordic-2025-03-30-gz.part08.b64 tmp/nordic-2025-03-30-gz.part09.b64 \
                     tmp/nordic-2025-03-30-gz.part10.b64
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Nordic Day 2025-03-30 full-source route"
          git push origin HEAD:${{ github.head_ref }}
