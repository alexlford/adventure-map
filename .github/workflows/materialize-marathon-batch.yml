name: Materialize marathon full-source routes

on:
  push:
    branches:
      - agent/full-source-marathon-batch-2026-08
    paths:
      - .github/workflows/materialize-marathon-batch.yml

permissions:
  contents: write

concurrency:
  group: materialize-marathon-routes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Assemble checksum-verified route artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json

          manifest_path = Path('.route-staging/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('schemaVersion') != 1:
              raise SystemExit('Unsupported staging manifest schema')
          if manifest.get('compression') != 'gzip' or manifest.get('encoding') != 'base64':
              raise SystemExit('Unexpected staging encoding')

          expected_routes = {
              'data/strava-route-full-resolution-colfax-marathon-2025.json': {
                  'id': 'strava-14522257426', 'points': 3835, 'lines': 1,
              },
              'data/strava-route-full-resolution-boulderthon-2024.json': {
                  'id': 'strava-12535362010', 'points': 3829, 'lines': 1,
              },
              'data/strava-route-full-resolution-chicago-marathon-2021.json': {
                  'id': 'strava-6094685711', 'points': 3666, 'lines': 2,
              },
              'data/strava-route-full-resolution-kansas-city-marathon-2019.json': {
                  'id': 'strava-4312788772', 'points': 3618, 'lines': 1,
              },
          }

          outputs = []
          seen = set()
          for item in manifest.get('routes', []):
              output = item['output']
              if output not in expected_routes:
                  raise SystemExit(f'Unexpected staged output: {output}')
              if output in seen:
                  raise SystemExit(f'Duplicate staged output: {output}')
              seen.add(output)

              encoded = ''.join(
                  Path(chunk).read_text(encoding='utf-8').strip()
                  for chunk in item['chunks']
              )
              raw = gzip.decompress(base64.b64decode(encoded, validate=True))
              if len(raw) != item['bytes']:
                  raise SystemExit(f"{output}: byte count {len(raw)} != expected {item['bytes']}")
              actual_sha = hashlib.sha256(raw).hexdigest()
              if actual_sha != item['sha256']:
                  raise SystemExit(f"{output}: SHA-256 {actual_sha} != expected {item['sha256']}")

              payload = json.loads(raw)
              if payload.get('encoding') != 'google-polyline5':
                  raise SystemExit(f'{output}: unexpected encoding metadata')
              if payload.get('source') != 'Strava account export':
                  raise SystemExit(f'{output}: unexpected source metadata')
              if payload.get('sampling') != 'full-source-track-gap-split-180m':
                  raise SystemExit(f'{output}: unexpected sampling metadata')
              routes = payload.get('routes', [])
              if len(routes) != 1:
                  raise SystemExit(f'{output}: expected exactly one route')
              route = routes[0]
              expected = expected_routes[output]
              if route.get('id') != expected['id']:
                  raise SystemExit(f"{output}: route id {route.get('id')} != {expected['id']}")
              if route.get('sourcePointCount') != expected['points']:
                  raise SystemExit(f"{output}: sourcePointCount {route.get('sourcePointCount')} != {expected['points']}")
              if route.get('retainedPointCount') != expected['points']:
                  raise SystemExit(f"{output}: retainedPointCount {route.get('retainedPointCount')} != {expected['points']}")
              if len(route.get('lines', [])) != expected['lines']:
                  raise SystemExit(f"{output}: line count {len(route.get('lines', []))} != {expected['lines']}")

              path = Path(output)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(raw)
              outputs.append(output)
              print(f'Verified {output}: {len(raw):,} bytes, SHA-256 {actual_sha}')

          if seen != set(expected_routes):
              missing = sorted(set(expected_routes) - seen)
              raise SystemExit(f'Missing staged outputs: {missing}')

          catalog_path = Path('data/route-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          files = list(catalog.get('polylineFiles', []))
          for output in outputs:
              if output not in files:
                  files.append(output)
          catalog['polylineFiles'] = files
          catalog['updatedOn'] = '2026-08-17'
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Rebuild publication artifacts
        run: npm run build:publish

      - name: Advance route-detail quality floor
        run: npm run update:route-detail-quality-floor

      - name: Assert marathon routes resolve to full source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json', 'utf8'));
          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json', 'utf8'));
          const expected = {
            'colfax-marathon-2025': ['data/strava-route-full-resolution-colfax-marathon-2025.json', 'strava-14522257426'],
            'boulderthon-2024': ['data/strava-route-full-resolution-boulderthon-2024.json', 'strava-12535362010'],
            'chicago-marathon-2021': ['data/strava-route-full-resolution-chicago-marathon-2021.json', 'strava-6094685711'],
            'kansas-city-marathon-2019': ['data/strava-route-full-resolution-kansas-city-marathon-2019.json', 'strava-4312788772'],
          };

          for (const [recordId, [file, featureId]] of Object.entries(expected)) {
            const entry = index.records?.[recordId];
            if (!entry) throw new Error(`${recordId}: missing from route-detail index`);
            if (entry.file !== file) throw new Error(`${recordId}: selected ${entry.file}, expected ${file}`);
            if (entry.featureId !== featureId) throw new Error(`${recordId}: selected ${entry.featureId}, expected ${featureId}`);
            if (entry.quality !== 'full-source') throw new Error(`${recordId}: quality ${entry.quality}, expected full-source`);
            if (floor.records?.[recordId] !== 'full-source') throw new Error(`${recordId}: quality floor was not promoted`);
            console.log(`${recordId}: ${featureId} -> ${file} [full-source]`);
          }
          NODE

      - name: Run fast repository validation
        run: npm run check:fast

      - name: Commit assembled production data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No production data changes to commit."
            exit 0
          fi
          git commit -m "Add next full-source marathon route detail"
          git push origin "HEAD:${GITHUB_REF_NAME}"
