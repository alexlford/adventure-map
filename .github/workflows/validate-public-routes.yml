name: Validate compiled Adventures routes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate source-derived GPS archive
        run: node scripts/validate-source-rdp-routes.mjs
      - name: Compile public routes
        run: node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
      - name: Validate compiled route contract
        run: node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
      - name: Audit GPS route point quality
        run: node scripts/audit-route-quality.mjs
