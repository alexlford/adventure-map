name: Materialize backfill priority Batch 2

on:
  push:
    branches:
      - agent/full-source-backfill-priority-2-2026-08
    paths:
      - .github/workflows/materialize-backfill-priority-2.yml

permissions:
  contents: write

concurrency:
  group: materialize-backfill-priority-2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Assemble and validate Batch 2 route artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          specs = {
            'baltimore-half-2018': 'baltimore-half-2018',
            'colfax-5k-2024': 'colfax-5k-2024',
            'colfax-half-2021': 'colfax-half-2021',
            'colfax-urban-10-2024': 'colfax-urban-10-2024',
            'estes-park-half-2021': 'estes-park-half-2021',
            'rocky-mountain-half-2025': 'rocky-mountain-half-2025',
          }

          outputs = []
          total_points = 0
          for stem, record_id in specs.items():
            chunks = sorted(Path('.route-staging').glob(f'{stem}.*.b64'))
            if not chunks:
              raise SystemExit(f'{stem}: no staging chunks')
            encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in chunks)
            raw = gzip.decompress(base64.b64decode(encoded, validate=True))
            digest = hashlib.sha256(raw).hexdigest()
            payload = json.loads(raw)
            if payload.get('sampling') != 'full-source-track-gap-split-180m':
              raise SystemExit(f'{stem}: unexpected sampling {payload.get("sampling")}')
            routes = payload.get('routes', [])
            if not routes:
              raise SystemExit(f'{stem}: no routes in payload')
            for route in routes:
              source = route.get('sourcePointCount')
              retained = route.get('retainedPointCount')
              if not isinstance(source, int) or source <= 1:
                raise SystemExit(f'{stem}: invalid sourcePointCount {source}')
              if retained != source:
                raise SystemExit(f'{stem}: retained {retained} != source {source}')
              if not route.get('lines'):
                raise SystemExit(f'{stem}: route has no lines')
              if record_id not in route.get('adventureIds', []):
                raise SystemExit(f'{stem}: {record_id} missing from adventureIds {route.get("adventureIds")}')
              total_points += source
            output = f'data/strava-route-full-resolution-{stem}.json'
            Path(output).write_bytes(raw)
            outputs.append(output)
            print(f'{stem}: {sum(r["sourcePointCount"] for r in routes):,} source points, {len(raw):,} bytes, sha256={digest}')

          catalog_path = Path('data/route-catalog.json')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          files = list(catalog.get('polylineFiles', []))
          for output in outputs:
            if output not in files:
              files.append(output)
          catalog['polylineFiles'] = files
          catalog['updatedOn'] = '2026-08-17'
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n', encoding='utf-8')
          print(f'Batch 2 retained {total_points:,} original GPS points across {len(outputs)} files')
          PY

      - name: Rebuild publication artifacts
        run: npm run build:publish

      - name: Advance route-detail quality floor
        run: npm run update:route-detail-quality-floor

      - name: Assert Batch 2 records resolve to full source
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const records = [
            'baltimore-half-2018',
            'colfax-5k-2024',
            'colfax-half-2021',
            'colfax-urban-10-2024',
            'estes-park-half-2021',
            'rocky-mountain-half-2025',
          ];
          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json', 'utf8'));
          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json', 'utf8'));
          for (const recordId of records) {
            const entry = index.records?.[recordId];
            if (!entry) throw new Error(`${recordId}: missing route-detail index entry`);
            if (entry.quality !== 'full-source') throw new Error(`${recordId}: quality ${entry.quality}`);
            if (!entry.file?.includes(`strava-route-full-resolution-${recordId}.json`)) {
              throw new Error(`${recordId}: unexpected winner ${entry.file}`);
            }
            if (floor.records?.[recordId] !== 'full-source') throw new Error(`${recordId}: floor not full-source`);
            console.log(`${recordId}: ${entry.featureId} -> ${entry.file} [full-source]`);
          }
          NODE

      - name: Run fast repository validation
        run: npm run check:fast

      - name: Commit production route data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No production changes to commit"
            exit 0
          fi
          git commit -m "Upgrade Batch 2 routes to full source"
          git push origin "HEAD:${GITHUB_REF_NAME}"
