name: Assemble staged high-resolution routes

on:
  push:
    branches: [hires-gps-routes-20260811]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v6
        with:
          ref: hires-gps-routes-20260811
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Assemble and validate source-derived routes
        run: node scripts/assemble-hires-routes.mjs
      - name: Restore normal materialization workflow
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/materialize-static-publishing.yml > .github/workflows/materialize-static-publishing.yml
      - name: Remove temporary staging workflow
        run: rm .github/workflows/assemble-hires-routes.yml
      - name: Commit assembled archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/strava-routes-hires.json.gz.b64 data/strava-routes-hires3.parts data/strava-routes-hires.parts .github/workflows/materialize-static-publishing.yml .github/workflows/assemble-hires-routes.yml
          git commit -m "Assemble high-resolution Strava route archive"
          git push origin HEAD:hires-gps-routes-20260811
