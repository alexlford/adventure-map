name: Stagecoach browser diagnostic

on:
  push:
    branches:
      - gps/full-source-stagecoach-2026-08-22

permissions:
  contents: read

jobs:
  browser-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build publication artifacts
        run: npm run build:publish
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser suite and capture compact failure
        id: browser
        shell: bash
        run: |
          set +e
          npm run test:browser > browser-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "===== browser diagnostic tail ====="
          tail -n 180 browser-diagnostic.log
          exit "$status"
      - name: Upload browser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stagecoach-browser-diagnostic
          path: browser-diagnostic.log
          retention-days: 1
