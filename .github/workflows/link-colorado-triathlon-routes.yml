name: Link Colorado Triathlon routes

on:
  push:
    branches: [fix/strava-route-coverage]
    paths:
      - '.github/workflows/link-colorado-triathlon-routes.yml'

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/strava-route-coverage
          fetch-depth: 0
      - name: Add Colorado Triathlon ownership to component routes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = [
              (Path('data/strava-route-backfill-01.json'), 'strava-10317055162'),
              (Path('data/activity-route-polylines.json'), 'activity-mtb-day-2023-12-02'),
          ]
          for path, route_id in targets:
              payload = json.loads(path.read_text())
              matches = [route for route in payload.get('routes', []) if route.get('id') == route_id]
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one {route_id}, found {len(matches)}')
              ids = matches[0].setdefault('adventureIds', [])
              if 'colorado-triathlon-2023' not in ids:
                  ids.append('colorado-triathlon-2023')
              path.write_text(json.dumps(payload, separators=(',', ':')) + '\n')
          PY
          rm .github/workflows/link-colorado-triathlon-routes.yml
      - name: Commit route ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava-route-backfill-01.json data/activity-route-polylines.json .github/workflows/link-colorado-triathlon-routes.yml
          git commit -m "Link Colorado Triathlon component routes"
          git push origin HEAD:fix/strava-route-coverage
