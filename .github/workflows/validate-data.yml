name: Validate Adventures data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build publication artifacts
        run: npm run build:publish
      - name: Validate canonical catalog
        run: npm run validate:data
      - name: Validate duplicate races
        run: npm run validate:duplicates
      - name: Validate stable record slugs
        run: npm run validate:slugs
      - name: Validate Story context and pending media
        run: npm run validate:stories
      - name: Validate World Marathon Majors passport
        run: npm run validate:majors
      - name: Validate production routing and branding
        run: npm run validate:routing
      - name: Validate route record references
        run: npm run validate:route-references
      - name: Validate source dependencies
        run: npm run validate:dependencies
      - name: Validate static publishing contract
        run: npm run validate:static
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/adventures-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              break
            fi
            sleep 0.5
          done
          npx playwright test --project=chromium
          npx playwright test tests/mobile-layout.spec.mjs tests/world-majors-layout.spec.mjs --project=webkit-mobile
      - name: Validate maintenance scripts
        run: python3 -m py_compile scripts/scan_strava_export.py scripts/advance_strava_state.py scripts/test_update_pipeline.py
      - name: Test maintenance pipeline
        run: npm run test:update-pipeline
      - name: Verify publication artifacts are committed
        run: |
          CHANGES="$(git status --porcelain --untracked-files=all -- shared.js data/public-records.json sitemap.xml robots.txt record map explore timeline stories races summits skiing nordic mtb)"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo "Generated publication artifacts are not current. Run npm run build:publish and commit the results."
            exit 1
          fi
