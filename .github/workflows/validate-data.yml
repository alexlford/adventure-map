name: Validate Adventures data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build publication artifacts
        run: npm run build:publish
      - name: Run static and data validation
        run: npm run validate:all
      - name: Test maintenance pipeline
        run: npm run test:update-pipeline
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Diagnose composite route color regression
        run: node scripts/run-browser-tests.mjs tests/composite-route-colors.spec.mjs
      - name: Diagnose visible composite route color regression
        run: node scripts/run-browser-tests.mjs tests/composite-story-visible-route-colors.spec.mjs
      - name: Diagnose browser group A - stories and detail
        run: >-
          node scripts/run-browser-tests.mjs
          tests/beerfit-story.spec.mjs
          tests/catalog-runtime-performance.spec.mjs
          tests/chapter-filter-state.spec.mjs
          tests/chapter-index-navigation.spec.mjs
          tests/chapter-presentation-polish.spec.mjs
          tests/decalibron-route.spec.mjs
          tests/detail-record-classes.spec.mjs
          tests/detail-renderer-single-pass.spec.mjs
          tests/geojson-route-detail.spec.mjs
      - name: Diagnose browser group B - map runtime
        run: >-
          node scripts/run-browser-tests.mjs
          tests/composite-route-detail.spec.mjs
          tests/map-api-boundary.spec.mjs
          tests/map-current-contracts.spec.mjs
          tests/map-keyboard-accessibility.spec.mjs
          tests/map-popup-links.spec.mjs
          tests/map-render-core.spec.mjs
          tests/map-route-detail-loading.spec.mjs
          tests/map-runtime-boundary.spec.mjs
          tests/map-url-state-api.spec.mjs
          tests/map-url-state.spec.mjs
      - name: Diagnose browser group C - publishing and resilience
        run: >-
          node scripts/run-browser-tests.mjs
          tests/mobile-layout.spec.mjs
          tests/optional-enrichment-resilience.spec.mjs
          tests/public-media-integrity.spec.mjs
          tests/publication-model.spec.mjs
          tests/race-core-enrichment-resilience.spec.mjs
          tests/race-timeline-consistency.spec.mjs
          tests/record-map-deep-link.spec.mjs
          tests/record-presentation-boundary.spec.mjs
          tests/route-feature-dedupe.spec.mjs
          tests/route-source-resilience.spec.mjs
      - name: Diagnose browser group D - site shell and visual
        run: >-
          node scripts/run-browser-tests.mjs
          tests/runtime-internal-links.spec.mjs
          tests/runtime-smoke.spec.mjs
          tests/shared-activity-records.spec.mjs
          tests/site-shell-consistency.spec.mjs
          tests/static-publishing.spec.mjs
          tests/ux-editorial-consistency.spec.mjs
          tests/visual-system-convergence.spec.mjs
          tests/world-majors-layout.spec.mjs
      - name: Run browser regression suite
        run: npm run test:browser
      - name: Verify publication artifacts are committed
        run: |
          CHANGES="$(git status --porcelain --untracked-files=all -- shared.js data/catalog-layers/records.json data/public-records.json data/route-detail-index.json sitemap.xml robots.txt record map explore timeline stories races summits skiing nordic mtb)"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo "Generated publication artifacts are not current. Run npm run build:publish and commit the results."
            exit 1
          fi
