name: Validate Adventures data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build publication artifacts
        run: npm run build:publish
      - name: Materialize generated publication artifacts on PR branch
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared.js data/catalog-layers/records.json data/public-records.json data/route-detail-index.json sitemap.xml robots.txt record map explore timeline stories races summits skiing nordic mtb
          if git diff --cached --quiet; then
            echo "Publication artifacts are already current."
          else
            git commit -m "Materialize static Adventures publication"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Run static and data validation
        run: npm run validate:all
      - name: Test maintenance pipeline
        run: npm run test:update-pipeline
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser regression suite
        run: npm run test:browser
      - name: Verify publication artifacts are committed
        run: |
          CHANGES="$(git status --porcelain --untracked-files=all -- shared.js data/catalog-layers/records.json data/public-records.json data/route-detail-index.json sitemap.xml robots.txt record map explore timeline stories races summits skiing nordic mtb)"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo "Generated publication artifacts are not current. Run npm run build:publish and commit the results."
            exit 1
          fi
