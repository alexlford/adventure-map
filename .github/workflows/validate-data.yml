name: Validate Adventures data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked Node dependencies
        run: npm ci
      - name: Build publication artifacts
        run: npm run build:publish
      - name: Run static and data validation
        run: npm run validate:all
      - name: Test maintenance pipeline
        run: npm run test:update-pipeline
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Diagnose Story shell
        run: npx playwright test tests/visual-system-convergence.spec.mjs --project=chromium --grep "Story diagnostic shell"
      - name: Diagnose Story theme tokens
        run: npx playwright test tests/visual-system-convergence.spec.mjs --project=chromium --grep "Story diagnostic theme tokens"
      - name: Diagnose Story route stroke
        run: npx playwright test tests/visual-system-convergence.spec.mjs --project=chromium --grep "Story diagnostic route stroke"
      - name: Run browser regression suite
        run: npm run test:browser
      - name: Verify publication artifacts are committed
        run: |
          CHANGES="$(git status --porcelain --untracked-files=all -- shared.js data/catalog-layers/records.json data/public-records.json data/route-detail-index.json sitemap.xml robots.txt record map explore timeline stories races summits skiing nordic mtb)"
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
            echo "Generated publication artifacts are not current. Run npm run build:publish and commit the results."
            exit 1
          fi
