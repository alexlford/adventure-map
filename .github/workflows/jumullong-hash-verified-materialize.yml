name: Materialize hash-verified Mount Jumullong route
# PR-visible validation and cleanup; bot-authored syncs are excluded to prevent loops.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          cat tmp/jumullong-payload-gz.part*.b64 | base64 --decode > tmp/jumullong-payload.json.gz
          echo '9cc3e68dbcf14667394222b6ccd9783cb77326984214620a28685f94b7bb4e50  tmp/jumullong-payload.json.gz' | sha256sum -c -
          gzip -dc tmp/jumullong-payload.json.gz > data/strava-route-full-resolution-mount-jumullong-manglo.json
          echo '905e26245099fb3898f1f1aa8a922cd0b61d93afbb1b4031519c209bb0379ac5  data/strava-route-full-resolution-mount-jumullong-manglo.json' | sha256sum -c -
          actual_blob="$(git hash-object data/strava-route-full-resolution-mount-jumullong-manglo.json)"
          test "$actual_blob" = '4d2dde4e78caeb41bcff2e99b6414dc1f527eaf0'
          echo "Verified final Git blob $actual_blob"

      - name: Verify decoded point count
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('data/strava-route-full-resolution-mount-jumullong-manglo.json', 'utf8'));
          const route = payload.routes?.[0];
          if (!route || route.id !== 'strava-7123707788') throw new Error('Unexpected Jumullong route payload');
          if (route.sourcePointCount !== 4625 || route.retainedPointCount !== 4625) throw new Error('Unexpected Jumullong metadata count');
          const count = line => {
            let index = 0;
            let points = 0;
            while (index < line.length) {
              for (let coordinate = 0; coordinate < 2; coordinate += 1) {
                let byte;
                do {
                  if (index >= line.length) throw new Error('Truncated polyline');
                  byte = line.charCodeAt(index++) - 63;
                } while (byte >= 0x20);
              }
              points += 1;
            }
            return points;
          };
          const decoded = route.lines.reduce((sum, line) => sum + count(line), 0);
          if (decoded !== 4625) throw new Error(`Decoded ${decoded} points; expected 4625`);
          console.log(`Decoded ${decoded} Jumullong points`);
          NODE

      - name: Register route and advance only Jumullong floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const routeFile = 'data/strava-route-full-resolution-mount-jumullong-manglo.json';
          const routeId = 'strava-7123707788';
          const catalogPath = 'data/route-catalog.json';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          if (!catalog.polylineFiles.includes(routeFile)) catalog.polylineFiles.push(routeFile);
          const dense = catalog.qualityExpectations.denseRoutes;
          const expected = { id: routeId, minPoints: 4600, resolutionPrefix: 'full-source-track' };
          const index = dense.findIndex(item => item.id === routeId);
          if (index >= 0) dense[index] = expected; else dense.push(expected);
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');

          const floorPath = 'data/route-detail-quality-floor.json';
          const floor = JSON.parse(fs.readFileSync(floorPath, 'utf8'));
          if (floor.records['mount-jumullong-manglo'] !== 'rdp-3m') {
            throw new Error(`Unexpected existing Jumullong floor: ${floor.records['mount-jumullong-manglo']}`);
          }
          floor.records['mount-jumullong-manglo'] = 'full-source';
          fs.writeFileSync(floorPath, JSON.stringify(floor, null, 2) + '\n');
          NODE

      - name: Build route-detail index
        run: node scripts/build-route-detail-index.mjs --write

      - name: Validate route and repository data
        run: |
          node scripts/validate-source-rdp-routes.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          npm run validate:all

      - name: Commit clean Jumullong change to PR head
        run: |
          rm .github/workflows/jumullong-hash-verified-materialize.yml
          rm tmp/jumullong-payload-gz.part*.b64 tmp/jumullong-payload.json.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strava-route-full-resolution-mount-jumullong-manglo.json data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git add -u -- .github/workflows/jumullong-hash-verified-materialize.yml tmp
          git commit -m 'Upgrade Mount Jumullong Manglo to full-source GPS'
          git push origin HEAD:${{ github.head_ref }}
