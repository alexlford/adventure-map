name: Clean Old Rag generated bytecode

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore tracked bytecode from main and self-clean
        run: |
          git fetch origin main
          git checkout origin/main -- scripts/__pycache__
          rm .github/workflows/old-rag-finalize-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u scripts/__pycache__ .github/workflows/old-rag-finalize-clean.yml
          git commit -m 'Restore generated Python bytecode'
          git push origin HEAD:${{ github.head_ref }}
