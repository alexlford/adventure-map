name: Materialize BeerFit Brew Mile race

on:
  push:
    branches:
      - feature/beerfit-brew-mile-race-2016
    paths:
      - '.github/workflows/materialize-beerfit-brew-mile-race.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out race branch
        uses: actions/checkout@v6
        with:
          ref: feature/beerfit-brew-mile-race-2016
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Register canonical evidence and route metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_id = 'recovered-strava-2026-08-17-beerfit-brew-mile'
          source_path = 'data/strava-mining-2026-08-17-beerfit-brew-mile.json'
          route_file = 'data/strava-route-full-resolution-beerfit-kansas-city-brew-mile-2016.json'
          route_id = 'strava-641962098'

          p = Path('data/evidence-sources.json')
          manifest = json.loads(p.read_text())
          manifest['updatedOn'] = '2026-08-17'
          if not any(s.get('id') == source_id for s in manifest['sources']):
              manifest['sources'].append({
                  'id': source_id,
                  'path': source_path,
                  'layer': 'recovered',
                  'description': 'Verified 2016 BeerFit Kansas City Brew Mile recovered from the original Strava GPX, same-day 5K pairing, contemporary event documentation, and user confirmation.'
              })
          if source_id not in manifest['loadOrder']:
              idx = manifest['loadOrder'].index('official-results-base')
              manifest['loadOrder'].insert(idx, source_id)
          p.write_text(json.dumps(manifest, indent=2) + '\n')

          p = Path('data/route-catalog.json')
          catalog = json.loads(p.read_text())
          catalog['updatedOn'] = '2026-08-17'
          if route_file not in catalog['polylineFiles']:
              catalog['polylineFiles'].append(route_file)
          dense = catalog.setdefault('qualityExpectations', {}).setdefault('denseRoutes', [])
          if not any(r.get('id') == route_id for r in dense):
              dense.append({
                  'id': route_id,
                  'minPoints': 150,
                  'resolutionPrefix': 'full-source-track'
              })
          p.write_text(json.dumps(catalog, indent=2) + '\n')
          PY
      - name: Build race publication
        run: npm run build:publish
      - name: Advance route-detail quality floor
        run: npm run update:route-detail-quality-floor
      - name: Rebuild with final quality metadata
        run: npm run build:publish
      - name: Validate race publication
        run: npm run validate:all
      - name: Remove one-time materializer and commit publication
        run: |
          git rm .github/workflows/materialize-beerfit-brew-mile-race.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish BeerFit Kansas City Brew Mile race"
          git push origin HEAD:feature/beerfit-brew-mile-race-2016
