name: Materialize full-source route backfill priority 6

on:
  push:
    branches:
      - agent/full-source-backfill-priority-6-2026-08
    paths:
      - '.github/workflows/materialize-full-source-backfill-priority-6.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backfill branch
        uses: actions/checkout@v6
        with:
          ref: agent/full-source-backfill-priority-6-2026-08
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Register Illinois Marathon full-source route
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/route-catalog.json')
          payload = json.loads(p.read_text())
          route_file = 'data/strava-route-full-resolution-illinois-marathon-2015.json'
          files = payload.setdefault('polylineFiles', [])
          if route_file not in files:
              files.append(route_file)
          payload['updatedOn'] = '2026-08-18'
          p.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Build publication and route-detail index
        run: npm run build:publish
      - name: Advance monotonic route-detail quality floor
        run: npm run update:route-detail-quality-floor
      - name: Rebuild after quality-floor update
        run: npm run build:publish
      - name: Validate full publication
        run: npm run validate:all
      - name: Remove one-time materializer and commit publication
        run: |
          git rm .github/workflows/materialize-full-source-backfill-priority-6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize Illinois Marathon full-source route"
          git push origin HEAD:agent/full-source-backfill-priority-6-2026-08
