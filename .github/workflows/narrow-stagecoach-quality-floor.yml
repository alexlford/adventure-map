name: Narrow Stagecoach quality-floor change

on:
  push:
    branches:
      - gps/full-source-stagecoach-2026-08-22
    paths:
      - '.github/workflows/narrow-stagecoach-quality-floor.yml'

permissions:
  contents: write

jobs:
  narrow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: gps/full-source-stagecoach-2026-08-22
          fetch-depth: 0
      - name: Restore main quality floor and advance Stagecoach only
        run: |
          git fetch origin main
          git show origin/main:data/route-detail-quality-floor.json > data/route-detail-quality-floor.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/route-detail-quality-floor.json')
          data = json.loads(p.read_text())
          current = data['records'].get('stagecoach-classic-15k-2024')
          if current != 'rdp-3m':
              raise SystemExit(f'Unexpected main Stagecoach floor: {current!r}')
          data['records']['stagecoach-classic-15k-2024'] = 'full-source'
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate narrowed publication
        run: npm run validate:all
      - name: Commit narrowed floor
        run: |
          git checkout -- scripts/__pycache__ 2>/dev/null || true
          git rm .github/workflows/narrow-stagecoach-quality-floor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route-detail-quality-floor.json
          git commit -m "Limit Stagecoach quality floor update"
          git push origin HEAD:gps/full-source-stagecoach-2026-08-22
