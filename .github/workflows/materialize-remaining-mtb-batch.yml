name: Materialize remaining MTB full-source routes

on:
  push:
    branches:
      - gps/full-source-remaining-mtb-2026-08-25
    paths:
      - .github/transfer/mtb-*.b64
      - .github/workflows/materialize-remaining-mtb-batch.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decode and verify exact route payloads
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          targets = [
              {
                  'date': '2024-08-31',
                  'featureId': 'activity-mtb-day-2024-08-31',
                  'points': 6104,
                  'lineCount': 4,
                  'sourcePointCounts': [6104],
                  'sha256': '678cf53296deeb06cdca0dcd2e07683b8b9cc2ab1efa4cf085a1866f0e6e7f76',
              },
              {
                  'date': '2025-09-28',
                  'featureId': 'activity-mtb-day-2025-09-28',
                  'points': 7095,
                  'lineCount': 4,
                  'sourcePointCounts': [7095],
                  'sha256': 'c4960e13dce57bbc05685c4ee170434d267103ab8b233394f05c9d7d46d5c98d',
              },
              {
                  'date': '2025-10-05',
                  'featureId': 'activity-mtb-day-2025-10-05',
                  'points': 5687,
                  'lineCount': 1,
                  'sourcePointCounts': [5687],
                  'sha256': 'aa6b50d3b7c09665b53eed5563c1783895238392a29eabcec8063dd91f95ae0b',
              },
              {
                  'date': '2026-05-24',
                  'featureId': 'activity-mtb-day-2026-05-24',
                  'points': 5521,
                  'lineCount': 3,
                  'sourcePointCounts': [3589, 1932],
                  'sha256': '8cc52b0fac8ebceba562074112666663ace4d859e48fd8ebe7705e619aef8829',
              },
              {
                  'date': '2026-08-05',
                  'featureId': 'activity-mtb-day-2026-08-05',
                  'points': 7981,
                  'lineCount': 1,
                  'sourcePointCounts': [7981],
                  'sha256': 'c1d8b30264f2aa4c524257ef97489a49412f25ccdf8e9608abdc82dc11cb612b',
              },
          ]

          for target in targets:
              transfer = root / '.github' / 'transfer' / f"mtb-{target['date']}.b64"
              raw = gzip.decompress(base64.b64decode(transfer.read_text().strip()))
              actual_sha = hashlib.sha256(raw).hexdigest()
              if actual_sha != target['sha256']:
                  raise SystemExit(f"{target['date']}: SHA-256 mismatch {actual_sha}")
              payload = json.loads(raw)
              if payload.get('encoding') != 'google-polyline5':
                  raise SystemExit(f"{target['date']}: unexpected encoding")
              if payload.get('sampling') != 'full-source-track-gap-split-180m':
                  raise SystemExit(f"{target['date']}: unexpected payload sampling")
              routes = payload.get('routes') or []
              if len(routes) != 1:
                  raise SystemExit(f"{target['date']}: expected exactly one route")
              route = routes[0]
              checks = {
                  'id': target['featureId'],
                  'sourcePointCount': target['points'],
                  'retainedPointCount': target['points'],
                  'sourcePointCounts': target['sourcePointCounts'],
                  'sampling': 'full-source-track-gap-split-180m',
              }
              for key, expected in checks.items():
                  if route.get(key) != expected:
                      raise SystemExit(
                          f"{target['date']}: {key} expected {expected!r}, found {route.get(key)!r}"
                      )
              if len(route.get('lines') or []) != target['lineCount']:
                  raise SystemExit(f"{target['date']}: unexpected line count")
              output = root / 'data' / f"strava-route-full-resolution-mtb-day-{target['date']}.json"
              output.write_bytes(raw)
              print(f"Verified and wrote {output}: {target['points']} points, {target['lineCount']} line(s)")

          catalog_path = root / 'data' / 'route-catalog.json'
          catalog = json.loads(catalog_path.read_text())
          polyline_files = list(catalog.get('polylineFiles') or [])
          for target in targets:
              rel = f"data/strava-route-full-resolution-mtb-day-{target['date']}.json"
              if rel not in polyline_files:
                  polyline_files.append(rel)
          catalog['polylineFiles'] = polyline_files

          quality = catalog.setdefault('qualityExpectations', {})
          dense_routes = list(quality.get('denseRoutes') or [])
          by_id = {str(item.get('id')): item for item in dense_routes if item.get('id')}
          for target in targets:
              item = by_id.get(target['featureId'])
              if item is None:
                  item = {'id': target['featureId']}
                  dense_routes.append(item)
                  by_id[target['featureId']] = item
              item['minPoints'] = target['points']
              item['resolutionPrefix'] = 'full-source-track'
          quality['denseRoutes'] = dense_routes
          quality['allowedTailRecoveries'] = [
              item
              for item in list(quality.get('allowedTailRecoveries') or [])
              if str(item.get('routeId')) != 'activity-mtb-day-2026-05-24'
          ]
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')
          print('Registered all five routes and retired the 2026-05-24 legacy tail recovery.')
          PY

      - name: Rebuild route detail publication metadata
        run: |
          npm run build:route-detail-index
          npm run update:route-detail-quality-floor

      - name: Verify publication selections and quality floors
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          dates = ['2024-08-31', '2025-09-28', '2025-10-05', '2026-05-24', '2026-08-05']
          points = {
              '2024-08-31': 6104,
              '2025-09-28': 7095,
              '2025-10-05': 5687,
              '2026-05-24': 5521,
              '2026-08-05': 7981,
          }
          index = json.loads(Path('data/route-detail-index.json').read_text())
          floor = json.loads(Path('data/route-detail-quality-floor.json').read_text())
          catalog = json.loads(Path('data/route-catalog.json').read_text())
          index_records = index.get('records') or {}
          floor_records = floor.get('records') or {}
          dense = {
              str(item.get('id')): item
              for item in catalog.get('qualityExpectations', {}).get('denseRoutes', [])
          }
          for date in dates:
              adventure_id = f'mtb-day-{date}'
              feature_id = f'activity-{adventure_id}'
              expected_file = f'data/strava-route-full-resolution-mtb-day-{date}.json'
              selected = index_records.get(adventure_id) or {}
              if selected.get('file') != expected_file or selected.get('quality') != 'full-source':
                  raise SystemExit(f'{adventure_id}: route detail index did not select full-source payload: {selected}')
              if floor_records.get(adventure_id) != 'full-source':
                  raise SystemExit(f'{adventure_id}: quality floor is not full-source')
              dense_item = dense.get(feature_id) or {}
              if dense_item.get('minPoints') != points[date] or dense_item.get('resolutionPrefix') != 'full-source-track':
                  raise SystemExit(f'{feature_id}: dense route contract is incorrect: {dense_item}')
          recoveries = catalog.get('qualityExpectations', {}).get('allowedTailRecoveries', [])
          if any(str(item.get('routeId')) == 'activity-mtb-day-2026-05-24' for item in recoveries):
              raise SystemExit('Obsolete 2026-05-24 tail recovery is still present')
          print('All five route selections, floors, and density contracts verified.')
          PY

      - name: Run route and data validation
        run: |
          npm run validate:route-detail-index
          npm run validate:route-detail-audit
          npm run validate:route-geometry
          npm run validate:route-references
          npm run validate:data
          npm run test:route-quality-floor
          npm run test:route-selection

      - name: Commit only final publication data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/transfer/mtb-2024-08-31.b64 \
                 .github/transfer/mtb-2025-09-28.b64 \
                 .github/transfer/mtb-2025-10-05.b64 \
                 .github/transfer/mtb-2026-05-24.b64 \
                 .github/transfer/mtb-2026-08-05.b64 \
                 .github/workflows/materialize-remaining-mtb-batch.yml
          git add data/route-catalog.json \
                  data/route-detail-index.json \
                  data/route-detail-quality-floor.json \
                  data/strava-route-full-resolution-mtb-day-2024-08-31.json \
                  data/strava-route-full-resolution-mtb-day-2025-09-28.json \
                  data/strava-route-full-resolution-mtb-day-2025-10-05.json \
                  data/strava-route-full-resolution-mtb-day-2026-05-24.json \
                  data/strava-route-full-resolution-mtb-day-2026-08-05.json
          echo "Final staged paths:"
          git diff --cached --name-only
          git commit -m "Upgrade remaining MTB routes to full-source GPS"
          git push
