name: Materialize segmented route publication boundary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Wire segmented routes through compiler and lazy loader
        env:
          COMPILER_REPLACEMENT_B64: 
          CATALOG_REPLACEMENT_B64: 
          TEST_CONTENT_B64: 
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path

          p = Path('scripts/build-public-routes.mjs')
          text = p.read_text()
          start = text.index('for (const polylineFile of polylineFiles) {')
          end = text.index('\nconst payload = {', start)
          replacement = base64.b64decode(os.environ['COMPILER_REPLACEMENT_B64']).decode()
          p.write_text(text[:start] + replacement + text[end:])

          p = Path('route-catalog.js')
          text = p.read_text()
          start = text.index('  async function polylineCollection(path) {')
          end = text.index('  async function loadAvailable(', start)
          replacement = base64.b64decode(os.environ['CATALOG_REPLACEMENT_B64']).decode()
          text = text[:start] + replacement + text[end:]
          old = "    const features = (collection.features || []).filter(feature => keyFor(feature) === entry.featureId);"
          new = "    const features = (collection.features || []).filter(feature => keyFor(feature) === entry.featureId || feature.properties?.routeFeatureId === entry.featureId);"
          if text.count(old) != 1:
              raise SystemExit('detail feature filter patch did not match exactly once')
          p.write_text(text.replace(old, new))

          Path('scripts/test-segmented-route-publication.mjs').write_bytes(base64.b64decode(os.environ['TEST_CONTENT_B64']))
          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package['scripts']
          scripts['test:segmented-route-publication'] = 'node scripts/test-segmented-route-publication.mjs'
          if 'npm run test:segmented-route-publication' not in scripts['validate:all']:
              scripts['validate:all'] += ' && npm run test:segmented-route-publication'
          package_path.write_text(json.dumps(package, indent=2) + '\n')
          PY

      - name: Validate segment boundary
        run: |
          npm ci
          npm run test:route-geometry-quality
          npm run test:segmented-route-publication
          npm run build:publish
          npm run validate:all
          git diff --exit-code -- data/route-detail-index.json map/index.html

      - name: Commit boundary implementation
        run: |
          rm -f .github/workflows/materialize-segment-publication-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/build-public-routes.mjs route-catalog.js scripts/test-segmented-route-publication.mjs package.json
          git add -u .github/workflows/materialize-segment-publication-boundary.yml
          git diff --cached --quiet && exit 0
          git commit -m "Wire segmented route publication end to end"
          git push origin HEAD:${{ github.head_ref }}
