name: Materialize hash-verified Hawksbill Mountain route

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          cat tmp/hawksbill-payload-gz.part*.b64 | base64 --decode > tmp/hawksbill-payload.json.gz
          echo 'fb29d3d50a1d74647e49fbbb5ae3dc81d37beba7da2109ac7534b034d944cd36  tmp/hawksbill-payload.json.gz' | sha256sum -c -
          gzip -dc tmp/hawksbill-payload.json.gz > data/strava-route-full-resolution-hawksbill-mountain.json
          echo '9bf03916328ce1ae9b80edb08394dc0491275ee84a0f04baa65c5b540c53f478  data/strava-route-full-resolution-hawksbill-mountain.json' | sha256sum -c -
          actual_blob="$(git hash-object data/strava-route-full-resolution-hawksbill-mountain.json)"
          test "$actual_blob" = 'f998c7d077cdb27370d1475b3863e7ed5fecfab3'
          echo "Verified final Git blob $actual_blob"

      - name: Verify decoded source point counts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('data/strava-route-full-resolution-hawksbill-mountain.json', 'utf8'));
          const route = payload.routes?.[0];
          if (!route || route.id !== 'strava-4469336427') throw new Error('Unexpected Hawksbill route payload');
          if (route.sourcePointCount !== 18841 || route.retainedPointCount !== 18841) throw new Error('Unexpected Hawksbill metadata count');
          if (route.sampling !== 'full-source-track-gap-split-180m-pause-split-300s-50m') throw new Error(`Unexpected Hawksbill sampling: ${route.sampling}`);
          const count = line => {
            let index = 0;
            let points = 0;
            while (index < line.length) {
              for (let coordinate = 0; coordinate < 2; coordinate += 1) {
                let byte;
                do {
                  if (index >= line.length) throw new Error('Truncated polyline');
                  byte = line.charCodeAt(index++) - 63;
                } while (byte >= 0x20);
              }
              points += 1;
            }
            return points;
          };
          const counts = route.lines.map(count);
          if (counts.length !== 2 || counts[0] !== 18812 || counts[1] !== 29) {
            throw new Error(`Unexpected Hawksbill line counts: ${counts.join(',')}`);
          }
          if (counts.reduce((sum, value) => sum + value, 0) !== 18841) throw new Error('Hawksbill decoded count mismatch');
          console.log(`Decoded Hawksbill line counts: ${counts.join(' + ')} = 18841`);
          NODE

      - name: Register route and advance only Hawksbill floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const routeFile = 'data/strava-route-full-resolution-hawksbill-mountain.json';
          const routeId = 'strava-4469336427';
          const catalogPath = 'data/route-catalog.json';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          if (!catalog.polylineFiles.includes(routeFile)) catalog.polylineFiles.push(routeFile);
          const dense = catalog.qualityExpectations.denseRoutes;
          const expected = { id: routeId, minPoints: 18800, resolutionPrefix: 'full-source-track' };
          const index = dense.findIndex(item => item.id === routeId);
          if (index >= 0) dense[index] = expected; else dense.push(expected);
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');

          const floorPath = 'data/route-detail-quality-floor.json';
          const floor = JSON.parse(fs.readFileSync(floorPath, 'utf8'));
          if (floor.records['hawksbill-mountain'] !== 'rdp-3m') {
            throw new Error(`Unexpected existing Hawksbill floor: ${floor.records['hawksbill-mountain']}`);
          }
          floor.records['hawksbill-mountain'] = 'full-source';
          fs.writeFileSync(floorPath, JSON.stringify(floor, null, 2) + '\n');
          NODE

      - name: Build route-detail index
        run: node scripts/build-route-detail-index.mjs --write

      - name: Validate route and repository data
        run: |
          node scripts/validate-source-rdp-routes.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          npm run validate:all

      - name: Commit clean Hawksbill change to PR head
        run: |
          rm .github/workflows/hawksbill-hash-verified-materialize.yml
          rm tmp/hawksbill-payload-gz.part*.b64 tmp/hawksbill-payload.json.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/strava-route-full-resolution-hawksbill-mountain.json data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git add -u -- .github/workflows/hawksbill-hash-verified-materialize.yml tmp
          git commit -m 'Upgrade Hawksbill Mountain to full-source GPS'
          git push origin HEAD:${{ github.head_ref }}
