name: Materialize route backfill Batch 3 metadata

on:
  push:
    branches:
      - agent/full-source-backfill-priority-3-2026-08

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Register Batch 3 route payloads
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/route-catalog.json')
          payload = json.loads(path.read_text())
          additions = [
              'data/strava-route-full-resolution-bolderboulder-2025.json',
              'data/strava-route-full-resolution-that-dam-run-10k-2022.json',
              'data/strava-route-full-resolution-rippetoe-rucksack-2025.json',
              'data/strava-route-full-resolution-run-snetterton-10k-2026.json',
              'data/strava-route-full-resolution-st-louis-turkey-trot-8k-2018.json',
              'data/strava-route-full-resolution-valentines-day-4m-2022.json',
          ]
          files = payload.setdefault('polylineFiles', [])
          for item in additions:
              if item not in files:
                  files.append(item)
          path.write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Rebuild route detail index
        run: npm run build:route-detail-index
      - name: Advance route detail quality floor
        run: npm run update:route-detail-quality-floor
      - name: Commit canonical metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          if ! git diff --cached --quiet; then
            git commit -m "Register full-source route backfill Batch 3"
            git push
          fi
