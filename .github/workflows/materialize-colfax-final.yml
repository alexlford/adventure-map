name: Materialize corrected Colfax photos

on:
  push:
    branches:
      - fix/colfax-photo-years-complete-20260828

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Decode and verify Colfax photos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p media/races
          base64 --decode tmp/colfax-direct-finish.b64 > media/races/colfax-2024-olive-finish.webp
          base64 --decode tmp/colfax-direct-pool2024.b64 > media/races/colfax-2024-dog-ice-pool.webp
          base64 --decode tmp/colfax-direct-pool2026.b64 > media/races/colfax-2026-olive-pool.webp

          echo "178c3e3c04aff1363a3a6b8f35e5704c3f54c0922d7a05f21a629ae74f11f7d6  media/races/colfax-2024-olive-finish.webp" | sha256sum -c -
          echo "274fb6e1312bc16bce36b5ca0f15800cb7e498fefd53bd4eafb861db1337d751  media/races/colfax-2024-dog-ice-pool.webp" | sha256sum -c -
          echo "2d90b79f4eb66863fc1f4f736c3b8e90842b1ae4da115ecd7385e87d3a3046e5  media/races/colfax-2026-olive-pool.webp" | sha256sum -c -

          for image in media/races/colfax-2024-olive-finish.webp media/races/colfax-2024-dog-ice-pool.webp media/races/colfax-2026-olive-pool.webp; do
            test "$(xxd -p -l 4 "$image")" = "52494646"
            test "$(xxd -p -s 8 -l 4 "$image")" = "57454250"
          done

      - name: Wire photos to the correct race years
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/race-memories.json';
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          payload.records ||= {};

          const y2024 = payload.records['colfax-5k-2024'] || {};
          y2024.photos = [
            {
              src: 'media/races/colfax-2024-olive-finish.webp',
              alt: 'Alex and Olive crossing the finish line at the 2024 Denver Colfax 5K.',
              caption: 'Crossing the Colfax 5K finish with Olive.'
            },
            {
              src: 'media/races/colfax-2024-dog-ice-pool.webp',
              alt: 'Olive, Basil, and other dogs cooling off in ice-water pools after the 2024 Denver Colfax 5K.',
              caption: 'Olive and Basil cooling off in the ice-water pools after the hot 5K.',
              aspect: '4:3'
            }
          ];
          payload.records['colfax-5k-2024'] = y2024;

          const prior2026 = payload.records['colfax-5k-2026'] || {};
          payload.records['colfax-5k-2026'] = {
            ...prior2026,
            headline: prior2026.headline || 'Colfax 5K with Olive.',
            memoryTitle: prior2026.memoryTitle || 'What I remember',
            memory: Array.isArray(prior2026.memory) && prior2026.memory.length
              ? prior2026.memory
              : ['Olive cooled off in one of the dog pools after the 2026 Denver Colfax 5K.'],
            photos: [
              {
                src: 'media/races/colfax-2026-olive-pool.webp',
                alt: 'Olive cooling off in a pool after the 2026 Denver Colfax 5K.',
                caption: 'Olive cooling off after the 2026 Colfax 5K.'
              }
            ]
          };

          fs.writeFileSync(path, JSON.stringify(payload));
          NODE

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Build publication
        run: npm run build:publish

      - name: Validate publication
        run: |
          npm run validate:static
          npm run validate:data

      - name: Commit corrected photos and publication
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          rm -f tmp/colfax-direct-finish.b64 tmp/colfax-direct-pool2024.b64 tmp/colfax-direct-pool2026.b64
          rm -f .github/workflows/materialize-colfax-final.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore Colfax 5K photos for 2024 and 2026"
          git push origin "HEAD:$BRANCH"
