name: Materialize MTB Day 2025-07-11 full-source route

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'gps/full-source-mtb-day-2025-07-11-2026-08-24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci
      - name: Reconstruct and verify MTB full-source payload
        shell: bash
        run: |
          set -euo pipefail
          cat tmp/mtb-2025-07-11-gz.part*.b64 | base64 -d > /tmp/mtb-2025-07-11.json.gz
          python3 - <<'PY'
          import gzip, hashlib, pathlib
          gz = pathlib.Path('/tmp/mtb-2025-07-11.json.gz').read_bytes()
          raw = gzip.decompress(gz)
          expected_sha = 'b5a32441b3c2e648d9eabcdf0cde186f60cdfecddaa6e2d6dc2759dcffcec062'
          actual_sha = hashlib.sha256(raw).hexdigest()
          assert actual_sha == expected_sha, (actual_sha, expected_sha)
          git_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          assert git_blob == 'af4bb16633720a1d2e3629f23c7dcc1b55aeeae9', git_blob
          pathlib.Path('data/strava-route-full-resolution-mtb-day-2025-07-11.json').write_bytes(raw)
          PY
      - name: Register route and rebuild route detail index
        run: |
          node <<'NODE'
          const fs = require('fs');
          const catalogPath = 'data/route-catalog.json';
          const file = 'data/strava-route-full-resolution-mtb-day-2025-07-11.json';
          const routeId = 'activity-mtb-day-2025-07-11';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          if (!catalog.polylineFiles.includes(file)) {
            const firstNordic = catalog.polylineFiles.findIndex(x => x.includes('strava-route-full-resolution-nordic'));
            if (firstNordic >= 0) catalog.polylineFiles.splice(firstNordic, 0, file);
            else catalog.polylineFiles.push(file);
          }
          catalog.qualityExpectations.denseRoutes = catalog.qualityExpectations.denseRoutes.filter(x => x.id !== routeId);
          catalog.qualityExpectations.denseRoutes.push({id: routeId, minPoints: 2860, resolutionPrefix: 'full-source-track'});
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');
          NODE
          npm run build:route-detail-index
          node <<'NODE'
          const fs = require('fs');
          const floorPath = 'data/route-detail-quality-floor.json';
          const floor = JSON.parse(fs.readFileSync(floorPath, 'utf8'));
          floor.records['mtb-day-2025-07-11'] = 'full-source';
          fs.writeFileSync(floorPath, JSON.stringify(floor, null, 2) + '\n');
          NODE
      - name: Verify full-source selection and exact geometry
        run: |
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('data/strava-route-full-resolution-mtb-day-2025-07-11.json','utf8'));
          const route = payload.routes[0];
          if (route.id !== 'activity-mtb-day-2025-07-11' || route.sourcePointCount !== 2890 || route.retainedPointCount !== 2890 || route.lines.length !== 1) throw new Error('MTB route metadata mismatch');
          function countPolyline(s) {
            let i = 0, count = 0;
            while (i < s.length) {
              for (let coord = 0; coord < 2; coord++) {
                let b;
                do { if (i >= s.length) throw new Error('truncated polyline'); b = s.charCodeAt(i++) - 63; } while (b >= 0x20);
              }
              count++;
            }
            return count;
          }
          const count = countPolyline(route.lines[0]);
          if (count !== 2890) throw new Error(`decoded ${count} points, expected 2890`);
          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json','utf8'));
          const rec = index.records['mtb-day-2025-07-11'];
          if (!rec || rec.file !== 'data/strava-route-full-resolution-mtb-day-2025-07-11.json' || rec.quality !== 'full-source') throw new Error('route detail index did not select full-source MTB route');
          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json','utf8'));
          if (floor.records['mtb-day-2025-07-11'] !== 'full-source') throw new Error('quality floor not advanced');
          NODE
      - name: Run route validators
        run: |
          npm run validate:route-references
          npm run validate:route-geometry
          npm run validate:route-detail-index
          npm run validate:route-detail-audit
          npm run test:route-quality-floor
      - name: Commit materialized route only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-mtb-day-2025-07-11.yml tmp/mtb-2025-07-11-gz.part*.b64
          git add data/strava-route-full-resolution-mtb-day-2025-07-11.json data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git diff --cached --name-only
          git commit -m 'Materialize MTB Day 2025-07-11 full-source route'
          git push origin HEAD:${{ github.head_ref }}
