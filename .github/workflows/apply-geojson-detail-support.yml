name: Apply GeoJSON detail support

on:
  push:
    branches:
      - agent/route-detail-2
    paths:
      - scripts/apply-geojson-detail-support.mjs
      - .github/workflows/apply-geojson-detail-support.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply GeoJSON detail support
        run: node scripts/apply-geojson-detail-support.mjs
      - name: Rebuild route detail index
        run: node scripts/build-route-detail-index.mjs --write
      - name: Remove one-shot migration files
        run: rm scripts/apply-geojson-detail-support.mjs .github/workflows/apply-geojson-detail-support.yml
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Support GeoJSON route detail sources"
          git push origin HEAD:${GITHUB_REF_NAME}
