name: Cleanup composite route artifacts

on:
  push:
    branches:
      - agent/composite-route-colors
    paths:
      - .github/workflows/cleanup-composite-route-artifacts.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/composite-route-colors
          fetch-depth: 0
      - name: Remove validation bytecode artifacts
        shell: bash
        run: |
          rm -rf scripts/__pycache__
          rm .github/workflows/cleanup-composite-route-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Remove validation bytecode artifacts"
          git push origin HEAD:agent/composite-route-colors
