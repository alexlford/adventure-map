name: Materialize MTB Day 2022-07-16 full-source

on:
  push:
    branches:
      - gps/full-source-mtb-day-2022-07-16-v2-2026-08-24

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gps/full-source-mtb-day-2022-07-16-v2-2026-08-24
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconstruct exact staged route payload
        run: |
          cat tmp/mtb-2022-07-16.part*.b64 | tr -d '\n' | base64 -d > /tmp/mtb-2022-07-16.json.gz
          gzip -dc /tmp/mtb-2022-07-16.json.gz > data/strava-route-full-resolution-mtb-day-2022-07-16.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const routePath = 'data/strava-route-full-resolution-mtb-day-2022-07-16.json';
          const payload = JSON.parse(fs.readFileSync(routePath, 'utf8'));
          const route = (payload.routes || []).find(item => item.id === 'activity-mtb-day-2022-07-16');
          if (!route) throw new Error('Missing activity-mtb-day-2022-07-16 in reconstructed payload');
          if (!String(route.sampling || payload.sampling || '').startsWith('full-source-track')) {
            throw new Error(`Unexpected sampling: ${route.sampling || payload.sampling}`);
          }
          if (Number(route.sourcePointCount) !== 5400) throw new Error(`Unexpected sourcePointCount: ${route.sourcePointCount}`);
          if (Number(route.retainedPointCount) !== 5400) throw new Error(`Unexpected retainedPointCount: ${route.retainedPointCount}`);
          if (!Array.isArray(route.stravaActivityIds) || !route.stravaActivityIds.map(String).includes('7480249980')) {
            throw new Error('Missing Strava activity 7480249980');
          }
          if (!Array.isArray(route.lines) || !route.lines.length) throw new Error('Reconstructed route has no encoded lines');

          const catalogPath = 'data/route-catalog.json';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          catalog.polylineFiles ||= [];
          if (!catalog.polylineFiles.includes(routePath)) {
            const anchor = catalog.polylineFiles.indexOf('data/strava-route-full-resolution-mtb-day-2023-12-02.json');
            if (anchor >= 0) catalog.polylineFiles.splice(anchor, 0, routePath);
            else catalog.polylineFiles.push(routePath);
          }
          catalog.qualityExpectations ||= {};
          catalog.qualityExpectations.denseRoutes ||= [];
          const existingDense = catalog.qualityExpectations.denseRoutes.find(item => item.id === 'activity-mtb-day-2022-07-16');
          if (existingDense) {
            existingDense.minPoints = Math.max(Number(existingDense.minPoints || 0), 5360);
            existingDense.resolutionPrefix = 'full-source-track';
          } else {
            catalog.qualityExpectations.denseRoutes.push({
              id: 'activity-mtb-day-2022-07-16',
              minPoints: 5360,
              resolutionPrefix: 'full-source-track',
            });
          }
          fs.writeFileSync(catalogPath, `${JSON.stringify(catalog, null, 2)}\n`);
          NODE
      - name: Rebuild route-quality artifacts
        run: |
          npm run build:route-detail-index
          npm run update:route-detail-quality-floor
      - name: Verify full-source promotion
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json', 'utf8'));
          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json', 'utf8'));
          const entry = index.records?.['mtb-day-2022-07-16'];
          if (entry?.file !== 'data/strava-route-full-resolution-mtb-day-2022-07-16.json') throw new Error(`Unexpected selected file: ${entry?.file}`);
          if (entry?.quality !== 'full-source') throw new Error(`Unexpected index quality: ${entry?.quality}`);
          if (floor.records?.['mtb-day-2022-07-16'] !== 'full-source') throw new Error(`Unexpected floor quality: ${floor.records?.['mtb-day-2022-07-16']}`);
          NODE
      - name: Run route validation
        run: |
          npm run test:route-quality-floor
          npm run test:route-geometry-quality
          npm run validate:route-detail-index
          npm run validate:route-detail-audit
          npm run validate:route-geometry
          npm run validate:route-references
      - name: Commit only final publication data
        run: |
          rm -f tmp/mtb-2022-07-16.part*.b64 .github/workflows/materialize-mtb-2022-07-16.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json data/strava-route-full-resolution-mtb-day-2022-07-16.json tmp/mtb-2022-07-16.part*.b64 .github/workflows/materialize-mtb-2022-07-16.yml
          expected='data/route-catalog.json
data/route-detail-index.json
data/route-detail-quality-floor.json
data/strava-route-full-resolution-mtb-day-2022-07-16.json'
          actual="$(git diff --cached --name-only --diff-filter=AM | sort)"
          if [ "$actual" != "$(printf "$expected" | sort)" ]; then
            echo 'Unexpected final added/modified files:'
            printf '%s\n' "$actual"
            exit 1
          fi
          git commit -m "Materialize MTB Day 2022-07-16 full-source route"
          git push origin HEAD:gps/full-source-mtb-day-2022-07-16-v2-2026-08-24
