name: Materialize hash-verified Free State relay route

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          cat tmp/free-state-payload-gz.part*.b64 | base64 --decode > tmp/free-state-payload.json.gz
          echo '3da05b80fcfd44eeb73d25c8a321f7d05259765d92072b3e3a4396e9d33503de  tmp/free-state-payload.json.gz' | sha256sum -c -
          gzip -dc tmp/free-state-payload.json.gz > data/strava-route-full-resolution-free-state-tri-100-relay-2015.json
          echo '219c31e80cf824decf0e614d13b45af1538b863fb6fc813d6f99eebd8b91f42a  data/strava-route-full-resolution-free-state-tri-100-relay-2015.json' | sha256sum -c -
          actual_blob="$(git hash-object data/strava-route-full-resolution-free-state-tri-100-relay-2015.json)"
          test "$actual_blob" = 'de2de4cccdcaf108f64c7d65b36417d88eeac2b9'
          echo "Verified final Git blob $actual_blob"

      - name: Verify decoded point count
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('data/strava-route-full-resolution-free-state-tri-100-relay-2015.json', 'utf8'));
          const route = payload.routes?.[0];
          if (!route || route.id !== 'strava-641965501') throw new Error('Unexpected Free State relay payload');
          if (route.sourcePointCount !== 2591 || route.retainedPointCount !== 2591) throw new Error('Unexpected Free State metadata count');
          if (!Array.isArray(route.lines) || route.lines.length !== 1) throw new Error('Expected one Free State route segment');
          const count = line => {
            let index = 0;
            let points = 0;
            while (index < line.length) {
              for (let coordinate = 0; coordinate < 2; coordinate += 1) {
                let byte;
                do {
                  if (index >= line.length) throw new Error('Truncated polyline');
                  byte = line.charCodeAt(index++) - 63;
                } while (byte >= 0x20);
              }
              points += 1;
            }
            return points;
          };
          const decoded = count(route.lines[0]);
          if (decoded !== 2591) throw new Error(`Decoded ${decoded} points; expected 2591`);
          console.log(`Decoded ${decoded} Free State relay points`);
          NODE

      - name: Register route and advance only Free State floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const routeFile = 'data/strava-route-full-resolution-free-state-tri-100-relay-2015.json';
          const routeId = 'strava-641965501';
          const catalogPath = 'data/route-catalog.json';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          if (!catalog.polylineFiles.includes(routeFile)) catalog.polylineFiles.push(routeFile);
          const dense = catalog.qualityExpectations.denseRoutes;
          const expected = { id: routeId, minPoints: 2550, resolutionPrefix: 'full-source-track' };
          const index = dense.findIndex(item => item.id === routeId);
          if (index >= 0) dense[index] = expected; else dense.push(expected);
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');

          const floorPath = 'data/route-detail-quality-floor.json';
          const floor = JSON.parse(fs.readFileSync(floorPath, 'utf8'));
          if (floor.records['free-state-tri-100-relay-2015'] !== 'rdp-3m') {
            throw new Error(`Unexpected existing Free State floor: ${floor.records['free-state-tri-100-relay-2015']}`);
          }
          floor.records['free-state-tri-100-relay-2015'] = 'full-source';
          fs.writeFileSync(floorPath, JSON.stringify(floor, null, 2) + '\n');
          NODE

      - name: Build route-detail index
        run: node scripts/build-route-detail-index.mjs --write

      - name: Validate route and repository data
        run: |
          node scripts/validate-source-rdp-routes.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          npm run validate:all

      - name: Commit only clean Free State data change
        run: |
          rm .github/workflows/free-state-hash-verified-materialize.yml
          rm tmp/free-state-payload-gz.part*.b64 tmp/free-state-payload.json.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/free-state-hash-verified-materialize.yml tmp/free-state-payload-gz.part00.b64 tmp/free-state-payload-gz.part01.b64 tmp/free-state-payload-gz.part02.b64 tmp/free-state-payload-gz.part03.b64 tmp/free-state-payload-gz.part04.b64
          git add data/strava-route-full-resolution-free-state-tri-100-relay-2015.json data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git commit -m 'Upgrade Free State Tri 100 Relay to full-source GPS'
          git push origin HEAD:${{ github.head_ref }}
