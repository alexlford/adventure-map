name: Materialize Nordic Day 2023-03-01 full-source route

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Reconstruct and verify Nordic full-source payload
        run: |
          cat tmp/nordic-2023-03-01-gz.part00.b64 \
              tmp/nordic-2023-03-01-gz.part01.b64 \
              tmp/nordic-2023-03-01-gz.part02.b64 \
              tmp/nordic-2023-03-01-gz.part03.b64 > tmp/nordic-2023-03-01.json.gz.b64
          base64 --decode tmp/nordic-2023-03-01.json.gz.b64 > tmp/nordic-2023-03-01.json.gz
          echo 'cb16353ccb9ac512c09510821eb4e25cb9a9bc8ab7e580fbd1a6dc4f4eee8716  tmp/nordic-2023-03-01.json.gz' | sha256sum --check --strict
          gzip --decompress --stdout tmp/nordic-2023-03-01.json.gz > data/strava-route-full-resolution-nordic-day-2023-03-01.json
          echo 'def0447430586cc1e5e11342d7b124b6fbc874a76a5f39205885f0d0a83cf56f  data/strava-route-full-resolution-nordic-day-2023-03-01.json' | sha256sum --check --strict
          test "$(git hash-object data/strava-route-full-resolution-nordic-day-2023-03-01.json)" = '7274fe93681d03c138ff4f374fa268c9d41bc8bf'

      - name: Register route and rebuild route detail index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog_path = Path('data/route-catalog.json')
          new_file = 'data/strava-route-full-resolution-nordic-day-2023-03-01.json'
          anchor = 'data/strava-route-full-resolution-nordic-2022-01-03.json'
          catalog = json.loads(catalog_path.read_text())
          files = catalog['polylineFiles']
          if new_file not in files:
              i = files.index(anchor) + 1
              files.insert(i, new_file)

          dense = catalog['qualityExpectations']['denseRoutes']
          if not any(item.get('id') == 'activity-nordic-day-2023-03-01' for item in dense):
              dense.append({
                  'id': 'activity-nordic-day-2023-03-01',
                  'minPoints': 4550,
                  'resolutionPrefix': 'full-source-track',
              })
          catalog['updatedOn'] = '2026-08-22'
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')

          floor_path = Path('data/route-detail-quality-floor.json')
          floor = json.loads(floor_path.read_text())
          prior = floor['records'].get('nordic-day-2023-03-01')
          if prior not in ('rdp-3m', 'full-source'):
              raise SystemExit(f'unexpected Nordic Day quality floor: {prior}')
          floor['records']['nordic-day-2023-03-01'] = 'full-source'
          floor_path.write_text(json.dumps(floor, indent=2) + '\n')
          PY

          node scripts/build-route-detail-index.mjs --write

      - name: Verify full-source selection and exact geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          route_file = 'data/strava-route-full-resolution-nordic-day-2023-03-01.json'
          payload = json.loads(Path(route_file).read_text())
          route = payload['routes'][0]
          assert payload['sampling'] == 'full-source-track-gap-split-180m'
          assert route['id'] == 'activity-nordic-day-2023-03-01'
          assert route['sourcePointCount'] == 4580
          assert route['sourcePointCounts'] == [4580]
          assert route['retainedPointCount'] == 4580
          assert route['sampling'] == 'full-source-track-gap-split-180m'
          assert len(route['lines']) == 1

          def decode(line):
              coords=[]; i=0; lat=0; lon=0
              while i < len(line):
                  for axis in range(2):
                      result=0; shift=0
                      while True:
                          b=ord(line[i])-63; i+=1
                          result |= (b & 0x1f) << shift
                          shift += 5
                          if b < 0x20: break
                      delta = ~(result >> 1) if result & 1 else result >> 1
                      if axis == 0: lat += delta
                      else: lon += delta
                  coords.append((lat/1e5, lon/1e5))
              return coords

          assert len(decode(route['lines'][0])) == 4580
          index = json.loads(Path('data/route-detail-index.json').read_text())
          record = index['records']['nordic-day-2023-03-01']
          assert record['file'] == route_file, record
          assert record['featureId'] == 'activity-nordic-day-2023-03-01', record
          assert record['quality'] == 'full-source', record
          PY

      - name: Run route validators
        run: |
          node scripts/validate-route-geometry-policy.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          node scripts/validate-source-rdp-routes.mjs
          npm run validate:route-detail-index
          npm run test:route-quality-floor

      - name: Commit materialized route only
        run: |
          rm -f tmp/public-routes.geojson tmp/nordic-2023-03-01.json.gz.b64 tmp/nordic-2023-03-01.json.gz
          rm -f .github/workflows/materialize-nordic-day-2023-03-01.yml
          rm -f tmp/nordic-2023-03-01-gz.part00.b64 tmp/nordic-2023-03-01-gz.part01.b64 \
                tmp/nordic-2023-03-01-gz.part02.b64 tmp/nordic-2023-03-01-gz.part03.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava-route-full-resolution-nordic-day-2023-03-01.json \
                  data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git add -u .github/workflows/materialize-nordic-day-2023-03-01.yml \
                     tmp/nordic-2023-03-01-gz.part00.b64 tmp/nordic-2023-03-01-gz.part01.b64 \
                     tmp/nordic-2023-03-01-gz.part02.b64 tmp/nordic-2023-03-01-gz.part03.b64
          git diff --cached --quiet && exit 0
          git commit -m "Materialize Nordic Day 2023-03-01 full-source route"
          git push origin HEAD:${{ github.head_ref }}
