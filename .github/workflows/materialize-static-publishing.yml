name: Materialize Adventures static publication

on:
  push:
    branches: [agent/static-publishing-v1]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/static-publishing-v1
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public records and static pages
        run: npm run build:publish
      - name: Validate generated structure
        run: npm run validate:static
      - name: Commit generated publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-records.json sitemap.xml robots.txt record map explore timeline stories races summits skiing nordic mtb
          if git diff --cached --quiet; then
            echo "Publication artifacts are already current."
            exit 0
          fi
          git commit -m "Materialize static Adventures publication"
          git push origin HEAD:agent/static-publishing-v1
