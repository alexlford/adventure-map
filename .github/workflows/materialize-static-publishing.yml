name: Materialize Adventures static publication

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate public records and static pages
        run: npm run build:publish
      - name: Validate generated structure
        run: npm run validate:static
      - name: Audit Strava route coverage
        run: node scripts/audit-strava-route-coverage.mjs
      - name: Export published Strava route IDs
        run: |
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs --ids-out=data/published-strava-activity-ids.txt
      - name: Commit generated publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public-records.json data/published-strava-activity-ids.txt sitemap.xml robots.txt record map explore timeline stories races summits skiing nordic mtb
          if git diff --cached --quiet; then
            echo "Publication artifacts are already current."
            exit 0
          fi
          git commit -m "Materialize static Adventures publication"
          git push origin HEAD:${{ github.ref_name }}
