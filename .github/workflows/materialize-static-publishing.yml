name: Materialize Adventures static publication

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/materialize-static-publishing.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'site-routes.js'
      - 'shared.template.js'
      - 'data/**'
      - 'detail.html'
      - 'index.html'
      - 'activities.html'
      - 'map.html'
      - 'timeline.html'
      - 'adventures.html'
      - 'races.html'
      - 'summits.html'
      - 'skiing.html'
      - 'nordic.html'
      - 'mountain-biking.html'
      - 'scripts/vendor-leaflet.mjs'
      - 'scripts/build-shared.mjs'
      - 'scripts/build-public-records.mjs'
      - 'scripts/build-static-site.mjs'
      - 'scripts/build-public-index.mjs'
      - 'scripts/audit-strava-route-coverage.mjs'
      - 'scripts/lib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate public records and static pages
        run: npm run build:publish
      - name: Validate generated structure
        run: npm run validate:static
      - name: Audit Strava route coverage
        run: node scripts/audit-strava-route-coverage.mjs
      - name: Commit generated publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json shared.js data/public-records.json sitemap.xml robots.txt vendor/leaflet record map explore timeline stories races summits skiing nordic mtb
          if git diff --cached --quiet; then
            echo "Publication artifacts are already current."
            exit 0
          fi
          git commit -m "Materialize static Adventures publication"
          git push origin HEAD:${{ github.ref_name }}
