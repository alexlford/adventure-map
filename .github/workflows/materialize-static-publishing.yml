name: Materialize Adventures static publication

on:
  push:
    branches-ignore: [main]
    paths:
      - '.github/workflows/materialize-static-publishing.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'site-routes.js'
      - 'shared.template.js'
      - 'data/**'
      - 'detail.html'
      - 'race-memory.js'
      - 'race-memory.css'
      - 'index.html'
      - 'activities.html'
      - 'map.html'
      - 'timeline.html'
      - 'adventures.html'
      - 'races.html'
      - 'summits.html'
      - 'skiing.html'
      - 'nordic.html'
      - 'mountain-biking.html'
      - 'scripts/vendor-leaflet.mjs'
      - 'scripts/build-shared.mjs'
      - 'scripts/build-catalog-record-layer.mjs'
      - 'scripts/build-public-records.mjs'
      - 'scripts/build-recurring-race-audit.mjs'
      - 'scripts/build-static-site.mjs'
      - 'scripts/build-public-index.mjs'
      - 'scripts/build-route-detail-index.mjs'
      - 'scripts/audit-strava-route-coverage.mjs'
      - 'scripts/lib/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Restore staged Staunton race photo
        run: |
          cat tmp/photo-stage/staunton-*.txt | tr -d '\n' | base64 --decode > media/races/staunton-2022-frankie.webp
          test "$(stat -c%s media/races/staunton-2022-frankie.webp)" -eq 44470
          echo "7e1ac5cc6f7d49ecfb71b85fb24dd622e1c322cf6e3760fca204790261f4a46a  media/races/staunton-2022-frankie.webp" | sha256sum --check
      - name: Generate public records, route index, and static pages
        run: npm run build:publish
      - name: Validate generated structure
        run: npm run validate:static
      - name: Audit Strava route coverage
        run: node scripts/audit-strava-route-coverage.mjs
      - name: Commit generated publication artifacts
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            REMOTE_SHA="$(git rev-parse "origin/$BRANCH")"
            HEAD_SHA="$(git rev-parse HEAD)"

            if [ "$HEAD_SHA" != "$REMOTE_SHA" ]; then
              echo "Publication branch advanced from $HEAD_SHA to $REMOTE_SHA; rebuilding from the latest head (attempt $attempt)."
              git reset --hard "$REMOTE_SHA"
              npm ci --ignore-scripts
              cat tmp/photo-stage/staunton-*.txt | tr -d '\n' | base64 --decode > media/races/staunton-2022-frankie.webp
              test "$(stat -c%s media/races/staunton-2022-frankie.webp)" -eq 44470
              echo "7e1ac5cc6f7d49ecfb71b85fb24dd622e1c322cf6e3760fca204790261f4a46a  media/races/staunton-2022-frankie.webp" | sha256sum --check
              npm run build:publish
              npm run validate:static
              node scripts/audit-strava-route-coverage.mjs
            fi

            git add media/races/staunton-2022-frankie.webp package-lock.json shared.js data/catalog-layers/records.json data/public-records.json data/recurring-race-audit.json data/route-detail-index.json sitemap.xml robots.txt vendor/leaflet record map explore timeline stories races summits skiing nordic mtb
            if git diff --cached --quiet; then
              echo "Publication artifacts are already current."
              exit 0
            fi

            git commit -m "Materialize static Adventures publication"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi

            echo "Publication push raced with another branch update; retrying from the latest remote head."
          done

          echo "Unable to materialize publication artifacts after 3 attempts."
          exit 1
