name: Materialize route compatibility

on:
  pull_request:
    paths:
      - data/strava-route-full-resolution-nordic-2022-01-02.json
      - data/strava-route-full-resolution-mtb-2025-06-07.json
      - scripts/materialize-route-compatibility.mjs
      - .github/workflows/materialize-route-compatibility.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert compressed route sources
        run: >-
          node scripts/materialize-route-compatibility.mjs
          data/strava-route-full-resolution-nordic-2022-01-02.json
          data/strava-route-full-resolution-mtb-2025-06-07.json
      - name: Commit compatible route sources
        shell: bash
        run: |
          if git diff --quiet -- data/strava-route-full-resolution-nordic-2022-01-02.json data/strava-route-full-resolution-mtb-2025-06-07.json; then
            echo "Route sources already compatible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava-route-full-resolution-nordic-2022-01-02.json data/strava-route-full-resolution-mtb-2025-06-07.json
          git commit -m "Materialize full-resolution route sources for browser runtime"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"