name: Cleanup summit route staging

on:
  push:
    branches:
      - agent/full-source-summit-batch-2026-08
    paths:
      - .github/workflows/cleanup-summit-staging.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary transfer machinery
        run: |
          rm -rf .route-staging
          rm -f .github/workflows/materialize-summit-batch.yml
          rm -f .github/workflows/cleanup-summit-staging.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "Remove temporary summit route staging"
          git push origin "HEAD:${GITHUB_REF_NAME}"
