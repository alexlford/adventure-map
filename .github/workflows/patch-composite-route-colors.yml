name: Patch composite route colors

on:
  push:
    branches:
      - agent/composite-route-colors
    paths:
      - .github/workflows/patch-composite-route-colors.yml
      - .github/patch-composite-route-colors.py
      - .github/fix-composite-route-routing.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/composite-route-colors
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply composite route color system
        run: |
          python3 .github/patch-composite-route-colors.py
          python3 .github/fix-composite-route-routing.py
      - name: Validate production source changes
        run: |
          npm run check:fast
          git diff --check
      - name: Commit source changes and remove temporary patch files
        shell: bash
        run: |
          rm .github/workflows/patch-composite-route-colors.yml .github/patch-composite-route-colors.py .github/fix-composite-route-routing.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Differentiate composite adventure routes by color"
          git push origin HEAD:agent/composite-route-colors
