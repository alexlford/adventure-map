name: Patch composite route colors

on:
  push:
    branches:
      - agent/composite-route-colors
    paths:
      - .github/workflows/patch-composite-route-colors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/composite-route-colors
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply composite route color system
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Shared route relationship/color resolver.
          route_path = Path('route-catalog.js')
          route = route_path.read_text()
          marker = "  const keyFor = feature => feature.id || feature.properties?.featureId || feature.properties?.id || null;\n"
          helper = r'''  const COMPOSITE_COLOR_TOKENS = Object.freeze({
    mtb: ['--activity-mtb', '#2f7d4a'],
    nordic: ['--activity-nordic', '#1779a8'],
    'road-races': ['--activity-road-races', '#d97706'],
    'trail-races': ['--activity-trail-races', '#b45309'],
    skiing: ['--activity-skiing', '#16a6c9'],
    summits: ['--activity-summits', '#16836d'],
    adventures: ['--activity-adventures', '#8b5cf6'],
    mixed: ['--activity-mixed', '#59636d']
  });
  const COMPOSITE_FALLBACK_ORDER = Object.freeze(['adventures', 'nordic', 'trail-races', 'skiing', 'road-races', 'summits', 'mtb', 'mixed']);
  const routeLayerForRecord = record => {
    if (!record) return 'adventures';
    if (record.kind === 'summit') return 'summits';
    if (record.mapCategory === 'ski' || record.discipline === 'ski') return 'skiing';
    if (record.discipline === 'mountain-bike' || record.mapCategory === 'mountain-bike' || record.mapCategory === 'downhill-mtb') return 'mtb';
    if (record.discipline === 'nordic' || record.mapCategory === 'nordic') return 'nordic';
    if (record.kind === 'race' && record.discipline === 'trail') return 'trail-races';
    if (record.kind === 'race') return 'road-races';
    return record.kind === 'event' && record.discipline === 'nordic' ? 'nordic' : 'adventures';
  };
  const compositeThemeColor = key => {
    const [token, fallback] = COMPOSITE_COLOR_TOKENS[key] || COMPOSITE_COLOR_TOKENS.mixed;
    try {
      const value = window.getComputedStyle?.(document.documentElement)?.getPropertyValue(token)?.trim();
      if (value) return value;
    } catch (_error) {}
    return fallback;
  };
  function compositeRouteContext(recordId, relationshipItems = [], records = []) {
    if (!recordId || !Array.isArray(relationshipItems) || !Array.isArray(records)) return null;
    const relationship = relationshipItems.find(rel => rel?.adventureId === recordId && Array.isArray(rel.memberIds) && rel.memberIds.length > 1);
    if (!relationship) return null;
    const byId = new Map(records.map(record => [record.id, record]));
    const usedKeys = new Set();
    const members = relationship.memberIds.map((id, index) => {
      const record = byId.get(id) || null;
      const semanticKey = routeLayerForRecord(record);
      let colorKey = semanticKey;
      if (usedKeys.has(colorKey)) colorKey = COMPOSITE_FALLBACK_ORDER.find(key => !usedKeys.has(key)) || COMPOSITE_FALLBACK_ORDER[index % COMPOSITE_FALLBACK_ORDER.length];
      usedKeys.add(colorKey);
      return Object.freeze({ id, index, record, semanticKey, colorKey, color: compositeThemeColor(colorKey) });
    });
    return Object.freeze({ recordId, relationship, members: Object.freeze(members) });
  }
  const compositeRouteColorForId = (memberId, context) => context?.members?.find(member => member.id === memberId)?.color || null;
  const compositeRouteColor = (feature, context) => {
    if (!context) return null;
    const owners = feature?.properties?.adventureIds || [];
    const member = context.members.find(item => owners.includes(item.id));
    return member?.color || null;
  };
'''
          if marker not in route:
              raise SystemExit('route-catalog.js: helper insertion marker missing')
          route = route.replace(marker, helper + marker, 1)
          old_export = "    recordProvenance,\n    keyFor\n"
          new_export = "    recordProvenance,\n    compositeRouteContext,\n    compositeRouteColor,\n    compositeRouteColorForId,\n    routeLayerForRecord,\n    keyFor\n"
          if old_export not in route:
              raise SystemExit('route-catalog.js: export marker missing')
          route_path.write_text(route.replace(old_export, new_export, 1))

          # Main map: relationship-aware colors only while a composite story is focused.
          replace_once('app.js',
            "const state={adventures:[],routes:null,filter:'all',search:'',yearFrom:null,yearTo:null,markers:new Map(),routeLayers:new Map(),routeFeatureLayers:new Map(),focusId:null,pinnedFocusId:null};",
            "const state={adventures:[],relationships:[],routes:null,filter:'all',search:'',yearFrom:null,yearTo:null,markers:new Map(),routeLayers:new Map(),routeFeatureLayers:new Map(),focusId:null,pinnedFocusId:null};")
          replace_once('app.js',
            "function baseRouteStyle(feature,category){const historical=feature.properties?.provenance==='historical-course';return{color:CATEGORY[category]?.color||'#17202a',weight:category==='summits'?3:4.5,opacity:historical?.64:.84,dashArray:historical?'8 6':null,lineCap:'round',lineJoin:'round'}}",
            "function focusedCompositeContext(){return state.focusId?AdventureRoutes.compositeRouteContext(state.focusId,state.relationships,state.adventures):null}\nfunction baseRouteStyle(feature,category){const historical=feature.properties?.provenance==='historical-course',compositeColor=AdventureRoutes.compositeRouteColor(feature,focusedCompositeContext());return{color:compositeColor||CATEGORY[category]?.color||'#17202a',weight:category==='summits'?3:4.5,opacity:historical?.64:.84,dashArray:historical?'8 6':null,lineCap:'round',lineJoin:'round'}}")
          replace_once('app.js',
            "const[adventures,rRes]=await Promise.all([AdventureCatalog.load(),fetch('data/routes.geojson')]);",
            "const[adventures,relationships,rRes]=await Promise.all([AdventureCatalog.load(),AdventureCatalog.loadRelationships(),fetch('data/routes.geojson')]);")
          replace_once('app.js',
            "state.adventures=adventures;state.routes=await AdventureRoutes.normalizeCollection(await rRes.json());",
            "state.adventures=adventures;state.relationships=relationships;state.routes=await AdventureRoutes.normalizeCollection(await rRes.json());")

          # Lazy high-resolution detail must keep the same composite colors after zoom-in.
          replace_once('map-route-detail.js', "        color: internal.categoryColor(record || category),", "        color: base.color,")
          replace_once('map-route-detail.js',
            "    const layer = L.geoJSON(detail.collection, {\n      interactive: false,\n      style: {\n        ...internal.baseRouteStyle(feature, runtime.layerFor(record)),\n        color: internal.categoryColor(record || 'adventures'),",
            "    const base = internal.baseRouteStyle(feature, runtime.layerFor(record));\n    const layer = L.geoJSON(detail.collection, {\n      interactive: false,\n      style: {\n        ...base,\n        color: base.color,")

          # Record pages: legend + matching component card accents + route strokes.
          renderer = Path('record-renderer.js')
          text = renderer.read_text()
          marker = "  const sportCard = (k, v, p = '', wide = false) => `<article class=\"sport-panel${wide ? ' wide' : ''}\"><small>${A.esc(k)}</small><strong>${A.esc(v || '—')}</strong>${p ? `<p>${A.esc(p)}</p>` : ''}</article>`;\n"
          addition = r'''  const compositeColorFor = (id, context) => AdventureRoutes.compositeRouteColorForId(id, context);
  const compositeColorAttrs = (id, context) => {
    const color = compositeColorFor(id, context);
    return color ? { className: ' has-route-color', style: ` style="--route-color:${A.esc(color)}"` } : { className: '', style: '' };
  };
  function storyRouteKey(context) {
    if (!context?.members?.length) return '';
    const items = context.members.map((member, index) => {
      const record = member.record;
      const detail = record ? [A.recordType(record), record.date ? A.formatDate(record.date) : ''].filter(Boolean).join(' · ') : `Route ${index + 1}`;
      return `<div class="story-route-key-item" style="--route-color:${A.esc(member.color)}"><span class="story-route-key-line" aria-hidden="true"></span><span><strong>${A.esc(record?.name || `Route ${index + 1}`)}</strong><small>${A.esc(detail)}</small></span></div>`;
    }).join('');
    return `<div id="storyRouteKey" class="story-route-key" aria-label="Route colors"><span class="story-route-key-label">Route key</span><div class="story-route-key-items">${items}</div></div>`;
  }
'''
          if marker not in text:
              raise SystemExit('record-renderer.js: helper marker missing')
          text = text.replace(marker, marker + addition, 1)

          old_generic = '''  function genericStoryConnections(connected) {\n    const connectedHtml = connected.length ? connected.map(item => `<a class="story-linked-record" href="${A.recordHref(item)}"><small>${A.esc(A.recordType(item))}</small><strong>${A.esc(item.name)}</strong><span>${A.esc(item.date ? A.formatDate(item.date) : (item.year || ''))}</span></a>`).join('')\n      : '<div class="story-linked-empty"><strong>Standalone chapter</strong><p>No separate race or summit records are required to tell this story.</p></div>';\n    return `<section class="story-record-connections"><div><p class="eyebrow">Connected records</p><h3>${connected.length ? `${connected.length} records inside this chapter` : 'One story, one record'}</h3><p>${connected.length ? 'Open the individual races, summits, or outings that make up the larger story.' : 'This chapter stands on its own, with the route and verified activity context carrying the record.'}</p></div><div class="story-linked-grid">${connectedHtml}</div></section>`;\n  }\n'''
          new_generic = '''  function genericStoryConnections(connected, compositeContext = null) {\n    const connectedHtml = connected.length ? connected.map(item => {\n      const attrs = compositeColorAttrs(item.id, compositeContext);\n      return `<a class="story-linked-record${attrs.className}"${attrs.style} href="${A.recordHref(item)}"><small>${A.esc(A.recordType(item))}</small><strong>${A.esc(item.name)}</strong><span>${A.esc(item.date ? A.formatDate(item.date) : (item.year || ''))}</span></a>`;\n    }).join('')\n      : '<div class="story-linked-empty"><strong>Standalone chapter</strong><p>No separate race or summit records are required to tell this story.</p></div>';\n    return `<section class="story-record-connections"><div><p class="eyebrow">Connected records</p><h3>${connected.length ? `${connected.length} records inside this chapter` : 'One story, one record'}</h3><p>${connected.length ? 'Open the individual races, summits, or outings that make up the larger story.' : 'This chapter stands on its own, with the route and verified activity context carrying the record.'}</p></div><div class="story-linked-grid">${connectedHtml}</div></section>`;\n  }\n'''
          if old_generic not in text:
              raise SystemExit('record-renderer.js: genericStoryConnections marker missing')
          text = text.replace(old_generic, new_generic, 1)

          text = text.replace("  function challengeFeature(record, components) {", "  function challengeFeature(record, components, compositeContext = null) {", 1)
          old_cards = "    const cards = ordered.map((item, index) => `<a class=\"story-component\" href=\"${A.recordHref(item)}\"><span>${String(index + 1).padStart(2, '0')}</span><small>${A.esc(A.recordType(item))}${item.date ? ` · ${A.esc(A.formatDate(item.date))}` : ''}</small><strong>${A.esc(item.name)}</strong><em>${A.esc(item.officialTime || item.distance || (Number.isFinite(item.distanceMi) ? `${item.distanceMi} mi` : 'Open record'))}</em></a>`).join('');"
          new_cards = "    const cards = ordered.map((item, index) => { const attrs = compositeColorAttrs(item.id, compositeContext); return `<a class=\"story-component${attrs.className}\"${attrs.style} href=\"${A.recordHref(item)}\"><span>${String(index + 1).padStart(2, '0')}</span><small>${A.esc(A.recordType(item))}${item.date ? ` · ${A.esc(A.formatDate(item.date))}` : ''}</small><strong>${A.esc(item.name)}</strong><em>${A.esc(item.officialTime || item.distance || (Number.isFinite(item.distanceMi) ? `${item.distanceMi} mi` : 'Open record'))}</em></a>`; }).join('');"
          if old_cards not in text:
              raise SystemExit('record-renderer.js: challenge cards marker missing')
          text = text.replace(old_cards, new_cards, 1)
          text = text.replace("  function storyModules(record, all, relationships) {", "  function storyModules(record, all, relationships, compositeContext = null) {", 1)
          text = text.replace("    const challenge = challengeFeature(record, genericConnected);", "    const challenge = challengeFeature(record, genericConnected, compositeContext);", 1)
          text = text.replace("genericStoryConnections(genericConnected)", "genericStoryConnections(genericConnected, compositeContext)")
          text = text.replace("genericStoryConnections(allConnected)", "genericStoryConnections(allConnected, compositeContext)")
          text = text.replace("else connections = genericStoryConnections(allConnected);", "else connections = genericStoryConnections(allConnected, compositeContext);", 1)
          text = text.replace("      story ? storyModules(record, all, relationships) : profileSection(ctx),", "      story ? storyModules(record, all, relationships, ctx.compositeContext) : profileSection(ctx),", 1)

          old_route_section = '''  function routeSection(ctx) {\n    const { record, isSummit } = ctx;\n    return `<section class="detail-route-section"><h2>${isSummit ? 'Recorded outing' : 'Course & location'}</h2><p id="routeMeta" class="card-meta">Loading route provenance…</p><div id="detailMap" class="detail-map" aria-label="Map for ${A.esc(record.name)}"></div></section>`;\n  }\n'''
          new_route_section = '''  function routeSection(ctx) {\n    const { record, isSummit, compositeContext } = ctx;\n    return `<section class="detail-route-section"><h2>${isSummit ? 'Recorded outing' : 'Course & location'}</h2><p id="routeMeta" class="card-meta">Loading route provenance…</p>${storyRouteKey(compositeContext)}<div id="detailMap" class="detail-map" aria-label="Map for ${A.esc(record.name)}"></div></section>`;\n  }\n'''
          if old_route_section not in text:
              raise SystemExit('record-renderer.js: route section marker missing')
          text = text.replace(old_route_section, new_route_section, 1)
          text = text.replace("  async function renderRecordMap(record) {", "  async function renderRecordMap(record, compositeContext = null) {", 1)
          old_style = "        const geo = L.geoJSON({ type: 'FeatureCollection', features }, { style: feature => ({ weight: 4.5, opacity: feature.properties?.provenance === 'historical-course' ? .64 : .86, dashArray: feature.properties?.provenance === 'historical-course' ? '8 6' : null, lineCap: 'round', lineJoin: 'round' }) }).addTo(map);"
          new_style = "        const geo = L.geoJSON({ type: 'FeatureCollection', features }, { style: feature => { const color = AdventureRoutes.compositeRouteColor(feature, compositeContext); return { ...(color ? { color } : {}), weight: 4.5, opacity: feature.properties?.provenance === 'historical-course' ? .64 : .86, dashArray: feature.properties?.provenance === 'historical-course' ? '8 6' : null, lineCap: 'round', lineJoin: 'round' }; } }).addTo(map);"
          if old_style not in text:
              raise SystemExit('record-renderer.js: map style marker missing')
          text = text.replace(old_style, new_style, 1)
          old_ctx = "      const ctx = { record, all, relationships, related, byId, ordered, index, prev, next, label, isSummit, isRace, isDownhill, headlineValue, majorsData };"
          new_ctx = "      const compositeContext = AdventureRoutes.compositeRouteContext(record.id, relationships, all);\n      const ctx = { record, all, relationships, related, byId, ordered, index, prev, next, label, isSummit, isRace, isDownhill, headlineValue, majorsData, compositeContext };"
          if old_ctx not in text:
              raise SystemExit('record-renderer.js: ctx marker missing')
          text = text.replace(old_ctx, new_ctx, 1)
          text = text.replace("      await renderRecordMap(record);", "      await renderRecordMap(record, compositeContext);", 1)
          renderer.write_text(text)

          # Editorial styling: compact map key and subtle component/card color cues.
          css = Path('story-themes.css')
          css_text = css.read_text()
          css_add = r'''
/* Composite stories: component colors reuse the site's activity palette so route identity remains clear without introducing a second design language. */
.story-route-key{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.7)}
.story-route-key-label{flex:0 0 auto;color:var(--muted);font-size:.62rem;font-weight:900;letter-spacing:.11em;text-transform:uppercase}
.story-route-key-items{display:flex;align-items:center;gap:10px 16px;flex:1 1 420px;flex-wrap:wrap}
.story-route-key-item{display:inline-flex;align-items:center;gap:8px;min-width:0}
.story-route-key-line{display:block;flex:0 0 26px;width:26px;height:4px;border-radius:999px;background:var(--route-color)}
.story-route-key-item strong{display:block;font-size:.75rem;line-height:1.1}
.story-route-key-item small{display:block;margin-top:2px;color:var(--muted);font-size:.58rem;line-height:1.15}
.story-component.has-route-color{overflow:hidden}.story-component.has-route-color:after{content:'';position:absolute;left:18px;right:18px;bottom:0;height:3px;border-radius:999px 999px 0 0;background:var(--route-color)}
.story-component.has-route-color>span{color:var(--route-color);opacity:.38}
.story-component.has-route-color:hover,.story-component.has-route-color:focus-visible{border-color:color-mix(in srgb,var(--route-color) 52%,var(--line));box-shadow:0 10px 28px color-mix(in srgb,var(--route-color) 12%,transparent)}
.story-linked-record.has-route-color{position:relative;overflow:hidden;padding-left:20px}.story-linked-record.has-route-color:before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 999px 999px 0;background:var(--route-color)}
.story-linked-record.has-route-color:hover,.story-linked-record.has-route-color:focus-visible{border-color:color-mix(in srgb,var(--route-color) 46%,var(--line));box-shadow:0 10px 28px color-mix(in srgb,var(--route-color) 10%,transparent)}
@media(max-width:520px){.story-route-key{align-items:flex-start}.story-route-key-label{width:100%}.story-route-key-items{display:grid;grid-template-columns:1fr;width:100%;gap:8px}.story-route-key-item strong{font-size:.78rem}}
'''
          if 'Composite stories: component colors reuse' in css_text:
              raise SystemExit('story-themes.css: composite block already present')
          css.write_text(css_text.rstrip() + '\n' + css_add.lstrip())

          # Browser regression coverage for multi-sport, multi-day, and lazy detail behavior.
          Path('tests/composite-route-colors.spec.mjs').write_text(r'''import { test, expect } from '@playwright/test';

const normalize = value => String(value || '').trim().toLowerCase();

async function routeKeyColors(page) {
  return page.locator('#storyRouteKey .story-route-key-item').evaluateAll(nodes => nodes.map(node => normalize(getComputedStyle(node).getPropertyValue('--route-color'))));
}

async function routeStrokeColors(page) {
  return page.locator('#detailMap .leaflet-overlay-pane path').evaluateAll(nodes => nodes.map(node => normalize(node.getAttribute('stroke'))).filter(Boolean));
}

async function expectCompositeStory(page, recordId, expectedCount, cardSelector) {
  await page.goto(`/detail.html?record=${encodeURIComponent(recordId)}`, { waitUntil: 'domcontentloaded' });
  await expect(page.locator('#storyRouteKey .story-route-key-item')).toHaveCount(expectedCount);
  const legendColors = await routeKeyColors(page);
  expect(new Set(legendColors).size).toBe(expectedCount);
  await expect.poll(async () => (await routeStrokeColors(page)).length, { timeout: 15000 }).toBeGreaterThanOrEqual(expectedCount);
  const strokes = await routeStrokeColors(page);
  for (const color of legendColors) expect(strokes).toContain(color);
  const cardColors = await page.locator(cardSelector).evaluateAll(nodes => nodes.map(node => normalize(getComputedStyle(node).getPropertyValue('--route-color'))));
  expect(cardColors).toEqual(legendColors);
}

test('multi-sport Royal Gorge story uses distinct semantic route colors', async ({ page }) => {
  await expectCompositeStory(page, 'royal-gorge-groove-weekend-2024', 2, '.story-component.has-route-color');
  const colors = await routeKeyColors(page);
  expect(colors).toContain('#b45309');
  expect(colors).toContain('#2f7d4a');
});

test('multi-day same-sport Kokopelli story assigns a distinct color to each day', async ({ page }) => {
  await expectCompositeStory(page, 'kokopelli-three-day-2025', 3, '.story-linked-record.has-route-color');
});

test('single-route records do not add a composite route key', async ({ page }) => {
  await page.goto('/detail.html?record=clingmans-dome', { waitUntil: 'domcontentloaded' });
  await expect(page.locator('#storyRouteKey')).toHaveCount(0);
});

test('focused composite map keeps distinct colors in lazy high-resolution detail', async ({ page }) => {
  await page.goto('/map/', { waitUntil: 'domcontentloaded' });
  await expect.poll(() => page.evaluate(() => window.AdventureMap?.state?.().recordCount || 0), { timeout: 15000 }).toBeGreaterThan(0);
  await page.evaluate(() => {
    window.AdventureMap.focus('colorado-triathlon-2023');
    window.AdventureMap.leaflet.setView([39.85, -105.30], 8, { animate: false });
    window.AdventureMapRouteDetail.refresh();
  });
  await expect.poll(() => page.evaluate(() => {
    const diagnostics = window.AdventureMapRouteDetail?.diagnostics?.();
    return (diagnostics?.targets || []).filter(target => target.id === 'colorado-triathlon-2023' && target.rendered).length;
  }), { timeout: 15000 }).toBe(3);
  const colors = await page.locator('.map-route-detail-line').evaluateAll(nodes => nodes.map(node => normalize(node.getAttribute('stroke'))).filter(Boolean));
  expect(new Set(colors).size).toBeGreaterThanOrEqual(3);
});
''')
          PY
      - name: Validate production source changes
        run: |
          npm run check:fast
          git diff --check
      - name: Commit source changes and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/patch-composite-route-colors.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route-catalog.js app.js map-route-detail.js record-renderer.js story-themes.css tests/composite-route-colors.spec.mjs .github/workflows/patch-composite-route-colors.yml
          git diff --cached --quiet && exit 1
          git commit -m "Differentiate composite adventure routes by color"
          git push origin HEAD:agent/composite-route-colors
