name: Materialize hash-verified Mount Wachusett route

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Reconstruct and verify exact payload
        shell: bash
        run: |
          cat tmp/wachusett-payload-gz.part*.b64 | base64 --decode > tmp/wachusett-payload.json.gz
          echo 'cc9806fb2b5d67bc0353dc4380d80ce6ba64bc958850101acc9e0938c97d0d55  tmp/wachusett-payload.json.gz' | sha256sum -c -
          gzip -dc tmp/wachusett-payload.json.gz > data/strava-route-full-resolution-mount-wachusett.json
          echo '8b4ed0164834f9775441ea16608f8294bb4e0d0799a414157ef732b21d052916  data/strava-route-full-resolution-mount-wachusett.json' | sha256sum -c -
          actual_blob="$(git hash-object data/strava-route-full-resolution-mount-wachusett.json)"
          test "$actual_blob" = '7c30247b5d1c12c3cfcf5506aca3dac16080c3d4'
          echo "Verified final Git blob $actual_blob"

      - name: Verify decoded point count
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('data/strava-route-full-resolution-mount-wachusett.json', 'utf8'));
          const route = payload.routes?.[0];
          if (!route || route.id !== 'strava-4337907837') throw new Error('Unexpected Mount Wachusett route payload');
          if (route.sourcePointCount !== 8835 || route.retainedPointCount !== 8835) throw new Error('Unexpected Mount Wachusett metadata count');
          if (!Array.isArray(route.lines) || route.lines.length !== 1) throw new Error('Expected one Mount Wachusett segment');
          const count = line => {
            let index = 0;
            let points = 0;
            while (index < line.length) {
              for (let coordinate = 0; coordinate < 2; coordinate += 1) {
                let byte;
                do {
                  if (index >= line.length) throw new Error('Truncated polyline');
                  byte = line.charCodeAt(index++) - 63;
                } while (byte >= 0x20);
              }
              points += 1;
            }
            return points;
          };
          const decoded = count(route.lines[0]);
          if (decoded !== 8835) throw new Error(`Decoded ${decoded} points; expected 8835`);
          console.log(`Decoded ${decoded} Mount Wachusett points`);
          NODE

      - name: Register route and advance only Mount Wachusett floor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const routeFile = 'data/strava-route-full-resolution-mount-wachusett.json';
          const routeId = 'strava-4337907837';
          const catalogPath = 'data/route-catalog.json';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          if (!catalog.polylineFiles.includes(routeFile)) catalog.polylineFiles.push(routeFile);
          const dense = catalog.qualityExpectations.denseRoutes;
          const expected = { id: routeId, minPoints: 8800, resolutionPrefix: 'full-source-track' };
          const index = dense.findIndex(item => item.id === routeId);
          if (index >= 0) dense[index] = expected; else dense.push(expected);
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');

          const floorPath = 'data/route-detail-quality-floor.json';
          const floor = JSON.parse(fs.readFileSync(floorPath, 'utf8'));
          if (floor.records['mount-wachusett'] !== 'rdp-3m') {
            throw new Error(`Unexpected existing Mount Wachusett floor: ${floor.records['mount-wachusett']}`);
          }
          floor.records['mount-wachusett'] = 'full-source';
          fs.writeFileSync(floorPath, JSON.stringify(floor, null, 2) + '\n');
          NODE

      - name: Build route-detail index
        run: node scripts/build-route-detail-index.mjs --write

      - name: Validate route and repository data
        run: |
          node scripts/validate-source-rdp-routes.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson
          node scripts/audit-route-quality.mjs tmp/public-routes.geojson
          npm run validate:all

      - name: Commit only clean Mount Wachusett data change
        run: |
          rm .github/workflows/wachusett-hash-verified-materialize.yml
          rm tmp/wachusett-payload-gz.part*.b64 tmp/wachusett-payload.json.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/wachusett-hash-verified-materialize.yml tmp/wachusett-payload-gz.part00.b64 tmp/wachusett-payload-gz.part01.b64 tmp/wachusett-payload-gz.part02.b64 tmp/wachusett-payload-gz.part03.b64 tmp/wachusett-payload-gz.part04.b64
          git add data/strava-route-full-resolution-mount-wachusett.json data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json
          git commit -m 'Upgrade Mount Wachusett to full-source GPS'
          git push origin HEAD:${{ github.head_ref }}
