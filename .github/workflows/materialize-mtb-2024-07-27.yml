name: Materialize MTB Day 2024-07-27 full-source route

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Reconstruct and verify payload
        run: |
          set -euo pipefail
          cat tmp/mtb-2024-07-27.part*.b64 | base64 -d > /tmp/mtb-2024-07-27.json.gz
          echo '682e1a966ca30bede8a0313b45ff6d2898d6c2ab65d8e465b2f04941015d7991  /tmp/mtb-2024-07-27.json.gz' | sha256sum -c -
          gzip -dc /tmp/mtb-2024-07-27.json.gz > data/strava-route-full-resolution-mtb-day-2024-07-27.json
          echo '2a389ca2f417d52c183b29fff20e096c7b861c6d811148b29111dab0a494a50e  data/strava-route-full-resolution-mtb-day-2024-07-27.json' | sha256sum -c -
          test "$(git hash-object data/strava-route-full-resolution-mtb-day-2024-07-27.json)" = '431d91eeb4088bcbab20760e60aa6fe2b83ae5df'
          PYTHONPATH=scripts python3 - <<'PY'
          import json
          from materialize_remaining_mtb_routes import decode_polyline, distance_review
          path = 'data/strava-route-full-resolution-mtb-day-2024-07-27.json'
          payload = json.load(open(path))
          assert payload['sampling'] == 'full-source-track-gap-split-180m'
          assert len(payload['routes']) == 1
          route = payload['routes'][0]
          assert route['id'] == 'activity-mtb-day-2024-07-27'
          assert route['adventureIds'] == ['mtb-day-2024-07-27']
          assert route['stravaActivityIds'] == ['11997305131']
          assert route['sourceFiles'] == ['activities/11997305131.gpx']
          assert route['sourcePointCount'] == 10069
          assert route['sourcePointCounts'] == [10069]
          assert route['retainedPointCount'] == 10069
          assert route['mtbMode'] == 'downhill'
          assert len(route['lines']) == 3
          assert sum(len(decode_polyline(line)) for line in route['lines']) == 10069
          review = distance_review(route, 45.55)
          assert review['classification'] == 'full-source-eligible', review
          assert abs(review['rawDistanceKm'] - 46.05986444816738) < 1e-6, review
          assert abs(review['distanceDeltaPercent'] - 1.1193511485562802) < 1e-6, review
          print('Verified MTB Day 2024-07-27 payload and distance classification:', review)
          PY
      - name: Register route and rebuild detail artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalogPath = 'data/route-catalog.json';
          const routePath = 'data/strava-route-full-resolution-mtb-day-2024-07-27.json';
          const routeId = 'activity-mtb-day-2024-07-27';
          const catalog = JSON.parse(fs.readFileSync(catalogPath, 'utf8'));
          const files = new Set(catalog.polylineFiles || []);
          files.add(routePath);
          catalog.polylineFiles = [...files].sort();
          const quality = catalog.qualityExpectations ||= {};
          const dense = quality.denseRoutes ||= [];
          let item = dense.find(entry => entry.id === routeId);
          if (!item) {
            item = { id: routeId };
            dense.push(item);
          }
          item.minPoints = 10069;
          item.resolutionPrefix = 'full-source-track';
          dense.sort((a, b) => String(a.id).localeCompare(String(b.id)));
          fs.writeFileSync(catalogPath, JSON.stringify(catalog, null, 2) + '\n');
          NODE
          node scripts/build-route-detail-index.mjs --write
          npm run update:route-detail-quality-floor
      - name: Verify publication selection and contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const index = JSON.parse(fs.readFileSync('data/route-detail-index.json', 'utf8'));
          const floor = JSON.parse(fs.readFileSync('data/route-detail-quality-floor.json', 'utf8'));
          const rec = index.records['mtb-day-2024-07-27'];
          if (rec?.file !== 'data/strava-route-full-resolution-mtb-day-2024-07-27.json' || rec?.quality !== 'full-source') {
            throw new Error(`Unexpected route-detail selection: ${JSON.stringify(rec)}`);
          }
          if (floor.records['mtb-day-2024-07-27'] !== 'full-source') {
            throw new Error('MTB Day 2024-07-27 quality floor did not advance to full-source');
          }
          const catalog = JSON.parse(fs.readFileSync('data/route-catalog.json', 'utf8'));
          const dense = (catalog.qualityExpectations?.denseRoutes || []).find(entry => entry.id === 'activity-mtb-day-2024-07-27');
          if (dense?.minPoints !== 10069 || dense?.resolutionPrefix !== 'full-source-track') {
            throw new Error(`Unexpected dense-route contract: ${JSON.stringify(dense)}`);
          }
          NODE
          npm run test:remaining-mtb-materializer
          npm run test:route-quality-floor
          npm run validate:route-geometry
      - name: Commit final four-file publication diff
        run: |
          set -euo pipefail
          rm -f tmp/mtb-2024-07-27.part*.b64 .github/workflows/materialize-mtb-2024-07-27.yml
          git add data/route-catalog.json data/route-detail-index.json data/route-detail-quality-floor.json data/strava-route-full-resolution-mtb-day-2024-07-27.json
          git add -u -- tmp/mtb-2024-07-27.part*.b64 .github/workflows/materialize-mtb-2024-07-27.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize MTB Day 2024-07-27 full-source route'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
