name: Restore legacy MTB tail recovery compatibility

on:
  push:
    branches:
      - gps/full-source-remaining-mtb-2026-08-25
    paths:
      - .github/workflows/restore-mtb-tail-recovery.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore legacy archive recovery entry
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/route-catalog.json')
          catalog = json.loads(path.read_text())
          quality = catalog.setdefault('qualityExpectations', {})
          recoveries = list(quality.get('allowedTailRecoveries') or [])
          route_id = 'activity-mtb-day-2026-05-24'
          if not any(str(item.get('routeId')) == route_id for item in recoveries):
              recoveries.insert(0, {
                  'routeId': route_id,
                  'lineIndex': 1,
                  'maxTrimEnd': 8,
              })
          quality['allowedTailRecoveries'] = recoveries
          path.write_text(json.dumps(catalog, indent=2) + '\n')
          PY

      - name: Verify compiled route contract
        run: |
          node scripts/validate-source-rdp-routes.mjs
          node scripts/build-public-routes.mjs --out tmp/public-routes.geojson
          node scripts/validate-public-route-contract.mjs tmp/public-routes.geojson

      - name: Commit compatibility fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-mtb-tail-recovery.yml
          git add data/route-catalog.json
          git commit -m "Preserve legacy MTB archive tail recovery"
          git push
