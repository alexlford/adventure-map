name: Fix composite Story route overlay

on:
  push:
    branches:
      - fix/composite-story-route-overlay-2026-08
    paths:
      - .github/workflows/fix-composite-story-route-overlay.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restrict composite Story map to component-owned routes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('record-renderer.js')
          text = renderer.read_text()
          old = """      const [payloads, recordOverride] = await Promise.all([AdventureRoutes.loadAll(), AdventureRoutes.recordProvenance(record.id)]);
      const features = payloads.flatMap(payload => payload.features || []).filter(feature => (feature.properties?.adventureIds || []).includes(record.id));
"""
          new = """      const [payloads, recordOverride] = await Promise.all([AdventureRoutes.loadAll(), AdventureRoutes.recordProvenance(record.id)]);
      const compositeMemberIds = new Set((compositeContext?.members || []).map(member => member.id));
      const features = payloads.flatMap(payload => payload.features || []).filter(feature => {
        const owners = feature.properties?.adventureIds || [];
        if (!owners.includes(record.id)) return false;
        if (!compositeMemberIds.size) return true;
        return owners.some(owner => compositeMemberIds.has(owner));
      });
"""
          if old not in text:
              raise SystemExit('record-renderer target block not found')
          renderer.write_text(text.replace(old, new, 1))

          test = Path('tests/composite-route-colors.spec.mjs')
          text = test.read_text()
          old = """  const strokes = await routeStrokeColors(page);
  for (const color of legendColors) expect(strokes).toContain(color);
  const cardColors = await componentColors(page, cardSelector);
"""
          new = """  const strokes = await routeStrokeColors(page);
  for (const color of legendColors) expect(strokes).toContain(color);
  for (const color of strokes) expect(legendColors).toContain(color);
  const cardColors = await componentColors(page, cardSelector);
"""
          if old not in text:
              raise SystemExit('composite color test target block not found')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Run repository checks
        run: npm run check:fast
      - name: Run composite route browser regression
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/composite-route-colors.spec.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add record-renderer.js tests/composite-route-colors.spec.mjs
          git commit -m "Keep composite Story maps aligned with route key"
          git push origin "HEAD:${GITHUB_REF_NAME}"
