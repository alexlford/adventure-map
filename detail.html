<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventure Detail | Alex Ford</title><link rel="stylesheet" href="section.css"></head><body><header class="site-header"><a class="brand" href="https://alexlford.com">ALEX FORD</a><nav class="nav"><a href="index.html">Map</a><a href="races.html">Races</a><a href="summits.html">Summits</a><a href="adventures.html">Adventures</a></nav></header><main class="page" id="page"><div class="empty">Loading adventure…</div></main><footer class="footer"><span>Adventure Map · Alex Ford</span><span>ad astra per aspera</span></footer><script src="shared.js"></script><script>
const A=AdventureSite;const id=new URLSearchParams(location.search).get('id');A.load().then(all=>{const a=all.find(x=>x.id===id);if(!a)throw new Error('Adventure not found.');const isSummit=a.kind==='summit', isRace=a.kind==='race';const label=isSummit?'Summit':isRace?A.raceType(a):'Challenge / Trek';const value=isSummit?`${A.fmt.format(a.elevationFt)}′`:a.officialTime||a.distance||(a.distanceMi?`${a.distanceMi} mi`:'');document.title=`${a.name} | Alex Ford`;page.innerHTML=`<section class="hero"><p class="eyebrow">${A.esc(label)}</p><h1>${A.esc(a.name)}</h1><p>${A.esc(a.currentName?`Now known as ${a.currentName}. `:'')}${A.esc(a.location||'')}${a.date?` · ${A.esc(A.formatDate(a.date))}`:''}${a.endDate?` – ${A.esc(A.formatDate(a.endDate))}`:''}</p></section><section class="metrics"><div class="metric"><strong>${A.esc(value||'—')}</strong><span>${isSummit?'elevation':isRace?'result / distance':'headline metric'}</span></div><div class="metric"><strong>${a.distanceMi?A.esc(a.distanceMi)+' mi':'—'}</strong><span>recorded distance</span></div><div class="metric"><strong>${a.elevationGainM?A.fmt.format(Math.round(a.elevationGainM))+' m':'—'}</strong><span>recorded gain</span></div><div class="metric"><strong>${a.elapsedSeconds?A.esc(A.formatDuration(a.elapsedSeconds)):'—'}</strong><span>Strava elapsed</span></div></section><section class="profile"><div class="profile-copy"><p class="eyebrow">The record</p><h2>${A.esc(a.note||'A place, a date, and the effort behind it.')}</h2><div class="fact-list"><div class="fact"><small>Date</small><strong>${A.esc(A.formatDate(a.date)||String(a.year||'—'))}</strong></div><div class="fact"><small>Location</small><strong>${A.esc(a.location||'—')}</strong></div><div class="fact"><small>Type</small><strong>${A.esc(label)}</strong></div><div class="fact"><small>Verification</small><strong>${A.esc(a.matchConfidence||a.matchSource||'Archive record')}</strong></div>${a.bib?`<div class="fact"><small>Bib</small><strong>${A.esc(a.bib)}</strong></div>`:''}${a.officialPlace?`<div class="fact"><small>Place</small><strong>${A.esc(a.officialPlace)}</strong></div>`:''}</div></div><aside><p class="eyebrow">Next layer</p><div class="card"><h3>Story + media</h3><p class="card-meta">This detail view is ready for a short personal memory, event result link, route map, and photos. Those become the next enrichment pass.</p></div></aside></section>`}).catch(e=>page.innerHTML=`<div class="empty">${A.esc(e.message)}</div>`);
</script></body></html>
