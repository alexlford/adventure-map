<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Adventure Detail | Alex Ford</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="section.css"></head><body><header class="site-header"><a class="brand" href="https://alexlford.com">ALEX FORD</a><nav class="nav"><a data-nav="map" href="index.html">Map</a><a data-nav="races" href="races.html">Races</a><a data-nav="summits" href="summits.html">Summits</a><a data-nav="adventures" href="adventures.html">Adventures</a></nav></header><main class="page" id="page"><div class="empty">Loading adventure…</div></main><footer class="footer"><span>Personal Adventure Almanac · Alex Ford</span><span>ad astra per aspera</span></footer><script src="shared.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="leaflet-mobile-fix.js"></script><script>
const A=AdventureSite;const id=new URLSearchParams(location.search).get('id');
async function renderRecordMap(a){const el=document.getElementById('detailMap');if(!el)return;try{const payloads=await Promise.all(['data/routes.geojson','data/mined-routes.geojson','data/historical-routes-v2.geojson'].map(u=>fetch(u).then(r=>r.ok?r.json():({features:[]}))));const features=payloads.flatMap(p=>p.features||[]).filter(f=>(f.properties?.adventureIds||[]).includes(a.id));const hasPoint=Number.isFinite(a.lat)&&Number.isFinite(a.lon);if(!features.length&&!hasPoint){el.outerHTML='<div class="empty">No public route geometry is available for this record yet.</div>';return;}await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const map=L.map(el,{scrollWheelZoom:false,worldCopyJump:true,zoomControl:true});window.stabilizeLeafletMap?.(map,el);const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors',updateWhenIdle:false,keepBuffer:3}).addTo(map);tiles.on('load',()=>map.invalidateSize({pan:false}));if(features.length){const geo=L.geoJSON({type:'FeatureCollection',features},{style:{weight:4,opacity:.82}}).addTo(map);map.fitBounds(geo.getBounds(),{padding:[30,30],maxZoom:14});}else{L.circleMarker([a.lat,a.lon],{radius:8,weight:2,fillOpacity:.9}).addTo(map);map.setView([a.lat,a.lon],a.kind==='summit'?10:11);}setTimeout(()=>map.invalidateSize({pan:false}),120);setTimeout(()=>{map.invalidateSize({pan:false});tiles.redraw();},450);}catch(e){console.error(e);el.outerHTML='<div class="empty">Route map could not be loaded.</div>';}}
Promise.all([A.load(),A.loadRelationships()]).then(([all,relationships])=>{const a=all.find(x=>x.id===id);if(!a)throw new Error('Adventure not found.');A.shell(a.kind==='summit'?'summits':a.kind==='race'?'races':'adventures');const isSummit=a.kind==='summit',isRace=a.kind==='race';const label=isSummit?'Summit':isRace?A.raceType(a):a.discipline==='ski-objective'?'Ski objective':a.discipline==='mountain-loop'?'Mountain adventure':'Challenge / Trek';const value=isSummit?`${A.fmt.format(a.elevationFt)}′`:a.officialTime||a.distance||(a.distanceMi?`${a.distanceMi} mi`:'');const actions=[a.resultUrl?`<a class="button-link" href="${A.esc(a.resultUrl)}" target="_blank" rel="noreferrer">View published result</a>`:'',`<a class="button-link secondary" href="index.html">Explore on main map</a>`].filter(Boolean).join('');const byId=new Map(all.map(x=>[x.id,x]));const related=relationships.filter(rel=>(rel.memberIds||[]).includes(a.id)||rel.adventureId===a.id);const relatedSection=related.length?`<section><div class="section-title"><h2>Part of a larger chapter</h2><p>Related events and challenges connected in the almanac.</p></div><div class="grid">${related.map(rel=>{const links=(rel.memberIds||[]).filter(x=>x!==a.id).map(x=>byId.get(x)).filter(Boolean).map(x=>`<a href="detail.html?id=${encodeURIComponent(x.id)}">${A.esc(x.name)}</a>`);if(rel.adventureId&&rel.adventureId!==a.id&&byId.has(rel.adventureId))links.push(`<a href="detail.html?id=${encodeURIComponent(rel.adventureId)}">${A.esc(byId.get(rel.adventureId).name)}</a>`);return `<article class="card"><p class="card-kicker">${A.esc((rel.years||[]).join(' · '))}</p><h3>${A.esc(rel.name)}</h3><p class="card-meta">${A.esc(rel.summary||'')}</p>${links.length?`<p class="card-meta">Related: ${links.join(' · ')}</p>`:''}</article>`}).join('')}</div></section>`:'';document.title=`${a.name} | Alex Ford`;page.innerHTML=`<section class="hero"><p class="eyebrow">${A.esc(label)}</p><h1>${A.esc(a.name)}</h1><p>${A.esc(a.currentName?`Now known as ${a.currentName}. `:'')}${A.esc(a.location||'')}${a.date?` · ${A.esc(A.formatDate(a.date))}`:''}${a.endDate?` – ${A.esc(A.formatDate(a.endDate))}`:''}</p><div class="record-actions">${actions}</div></section><section class="metrics"><div class="metric"><strong>${A.esc(value||'—')}</strong><span>${isSummit?'elevation':isRace?'result / distance':'headline metric'}</span></div><div class="metric"><strong>${a.distanceMi?A.esc(a.distanceMi)+' mi':'—'}</strong><span>recorded distance</span></div><div class="metric"><strong>${a.elevationGainM?A.fmt.format(Math.round(a.elevationGainM))+' m':'—'}</strong><span>recorded gain</span></div><div class="metric"><strong>${a.elapsedSeconds?A.esc(A.formatDuration(a.elapsedSeconds)):'—'}</strong><span>elapsed time</span></div></section><section class="profile"><div class="profile-copy"><p class="eyebrow">The record</p><h2>${A.esc(a.note||'A place, a date, and the effort behind it.')}</h2><div class="fact-list"><div class="fact"><small>Date</small><strong>${A.esc(A.formatDate(a.date)||String(a.year||'—'))}</strong></div><div class="fact"><small>Location</small><strong>${A.esc(a.location||'—')}</strong></div><div class="fact"><small>Type</small><strong>${A.esc(label)}</strong></div>${a.bib?`<div class="fact"><small>Bib</small><strong>${A.esc(a.bib)}</strong></div>`:''}${a.officialPlace?`<div class="fact"><small>Place</small><strong>${A.esc(a.officialPlace)}</strong></div>`:''}${a.eventSeries?`<div class="fact"><small>Series</small><strong>${A.esc(a.eventSeries)}</strong></div>`:''}</div></div><aside><p class="eyebrow">Almanac</p><div class="card"><h3>${a.stravaActivityId?'Recorded activity':'Adventure record'}</h3><p class="card-meta">Part of the curated Personal Adventure Almanac.</p></div></aside></section>${relatedSection}<section class="detail-route-section"><h2>${isSummit?'Recorded outing':'Course & location'}</h2><div id="detailMap" class="detail-map" aria-label="Map for ${A.esc(a.name)}"></div></section>`;renderRecordMap(a)}).catch(e=>page.innerHTML=`<div class="empty">${A.esc(e.message)}</div>`);
</script></body></html>
