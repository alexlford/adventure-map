<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Adventure | Alex Ford Adventures</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="section.css"></head><body><header class="site-header"><a class="brand" href="https://alexlford.com">ALEX FORD</a><nav class="nav"></nav></header><main class="page" id="page"><div class="empty">Loading adventure…</div></main><footer class="footer"><span>Alex Ford Adventures</span><span>ad astra per aspera</span></footer><script src="shared.js"></script><script src="route-catalog.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="leaflet-mobile-fix.js"></script><script>
const A=AdventureSite;const params=new URLSearchParams(location.search),recordKey=params.get('record'),legacyId=params.get('id');
const provenanceLabel=p=>p==='personal-gps'?'Personal GPS route':p==='historical-course'?'Historical course':p==='privacy-withheld'?'Route withheld for privacy':p==='location-only'?'Location only':'Route';
const groupFor=a=>a.kind==='summit'?'summits':a.discipline==='mountain-bike'?'mountain-biking':a.discipline==='nordic'?'nordic':a.discipline==='ski'||a.discipline==='ski-objective'?'skiing':a.kind==='race'?'races':'adventures';
const labelFor=a=>a.kind==='summit'?'Summit':a.kind==='race'?A.raceType(a):a.kind==='outing'&&a.discipline==='mountain-bike'?(a.mtbMode==='downhill'?'Downhill MTB outing':'MTB outing'):a.kind==='outing'&&a.discipline==='nordic'?'Nordic outing':a.kind==='event'?A.eventType(a):a.discipline==='ski-objective'?'Ski objective':a.discipline==='mountain-loop'?'Mountain adventure':'Challenge / Trek';
const dateKey=a=>a.date||String(a.year||'0000');
async function renderRecordMap(a){const el=document.getElementById('detailMap');if(!el)return;try{const [collection,recordOverride]=await Promise.all([AdventureRoutes.loadAll(),AdventureRoutes.recordProvenance(a.id)]);const features=(collection.features||[]).filter(f=>(f.properties?.adventureIds||[]).includes(a.id));const hasPoint=Number.isFinite(a.lat)&&Number.isFinite(a.lon);const routeMeta=document.getElementById('routeMeta');if(routeMeta){const primary=features[0]?.properties;if(primary)routeMeta.textContent=`${provenanceLabel(primary.provenance)}${primary.note?` · ${primary.note}`:''}`;else if(recordOverride)routeMeta.textContent=`${provenanceLabel(recordOverride.provenance)}${recordOverride.note?` · ${recordOverride.note}`:''}`;else routeMeta.textContent='Location marker only; no public route geometry is attached to this record.';}if(!features.length&&!hasPoint){el.outerHTML='<div class="empty">No public route geometry is available for this record yet.</div>';return;}await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const map=L.map(el,{scrollWheelZoom:false,worldCopyJump:true,zoomControl:true});window.stabilizeLeafletMap?.(map,el);const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors',updateWhenIdle:false,keepBuffer:3}).addTo(map);tiles.on('load',()=>map.invalidateSize({pan:false}));if(features.length){const geo=L.geoJSON({type:'FeatureCollection',features},{style:f=>({weight:4.5,opacity:f.properties?.provenance==='historical-course'?.64:.86,dashArray:f.properties?.provenance==='historical-course'?'8 6':null,lineCap:'round',lineJoin:'round'})}).addTo(map);map.fitBounds(geo.getBounds(),{padding:[30,30],maxZoom:14});}else{L.circleMarker([a.lat,a.lon],{radius:8,weight:2,fillOpacity:.9}).addTo(map);map.setView([a.lat,a.lon],a.kind==='summit'?10:11);}setTimeout(()=>map.invalidateSize({pan:false}),120);setTimeout(()=>{map.invalidateSize({pan:false});tiles.redraw();},450);}catch(e){console.error(e);el.outerHTML='<div class="empty">Route map could not be loaded.</div>';}}
Promise.all([A.load(),A.loadRelationships()]).then(([all,relationships])=>{const a=all.find(x=>recordKey?x.slug===recordKey||x.id===recordKey:x.id===legacyId);if(!a)throw new Error('Adventure not found.');A.shell(groupFor(a));const label=labelFor(a),isSummit=a.kind==='summit',isRace=a.kind==='race',isDownhill=a.discipline==='mountain-bike'&&(a.mtbMode==='downhill'||a.mapCategory==='downhill-mtb');const value=isSummit?`${A.fmt.format(a.elevationFt)}′`:a.officialTime||a.distance||(a.distanceMi?`${a.distanceMi} mi`:'');const peers=all.filter(x=>x.id!==a.id&&groupFor(x)===groupFor(a)).sort((x,y)=>dateKey(x).localeCompare(dateKey(y)));const ordered=[...peers,a].sort((x,y)=>dateKey(x).localeCompare(dateKey(y)));const idx=ordered.findIndex(x=>x.id===a.id),prev=idx>0?ordered[idx-1]:null,next=idx<ordered.length-1?ordered[idx+1]:null;const actions=[a.resultUrl?`<a class="button-link" href="${A.esc(a.resultUrl)}" target="_blank" rel="noreferrer">View published result</a>`:'',`<a class="button-link secondary" href="${A.pageHref('map.html')}">Explore on map</a>`].filter(Boolean).join('');const byId=new Map(all.map(x=>[x.id,x]));const related=relationships.filter(rel=>(rel.memberIds||[]).includes(a.id)||rel.adventureId===a.id);const relatedSection=related.length?`<section><div class="section-title"><h2>Part of a larger story</h2><p>Related events and challenges connected across Adventures.</p></div><div class="grid">${related.map(rel=>{const links=(rel.memberIds||[]).filter(x=>x!==a.id).map(x=>byId.get(x)).filter(Boolean).map(x=>`<a href="${A.recordHref(x)}">${A.esc(x.name)}</a>`);if(rel.adventureId&&rel.adventureId!==a.id&&byId.has(rel.adventureId)){const relatedAdventure=byId.get(rel.adventureId);links.push(`<a href="${A.recordHref(relatedAdventure)}">${A.esc(relatedAdventure.name)}</a>`)}return `<article class="card"><p class="card-kicker">${A.esc((rel.years||[]).join(' · '))}</p><h3>${A.esc(rel.name)}</h3><p class="card-meta">${A.esc(rel.summary||'')}</p>${links.length?`<p class="card-meta">Related: ${links.join(' · ')}</p>`:''}</article>`}).join('')}</div></section>`:'';const chips=[label,a.date?A.formatDate(a.date):a.year,a.location,a.routeInfo?.provenance?provenanceLabel(a.routeInfo.provenance):null].filter(Boolean).map(x=>`<span class="almanac-chip">${A.esc(x)}</span>`).join('');const chronology=(prev||next)?`<nav class="chronology-nav" aria-label="Nearby entries">${prev?`<a class="chronology-link" href="${A.recordHref(prev)}"><small>Previous ${A.esc(groupFor(a).replace('-',' '))} entry</small><strong>← ${A.esc(prev.name)}</strong></a>`:'<div></div>'}${next?`<a class="chronology-link next" href="${A.recordHref(next)}"><small>Next ${A.esc(groupFor(a).replace('-',' '))} entry</small><strong>${A.esc(next.name)} →</strong></a>`:''}</nav>`:'';document.title=`${a.name} | Alex Ford Adventures`;const description=`${label} · ${a.location||''}${a.date?` · ${A.formatDate(a.date)}`:''}`;A.refreshMeta(description);page.innerHTML=`<section class="hero"><p class="eyebrow">Adventures · ${A.esc(label)}</p><h1>${A.esc(a.name)}</h1><p>${A.esc(a.currentName?`Now known as ${a.currentName}. `:'')}${A.esc(a.location||'')}${a.date?` · ${A.esc(A.formatDate(a.date))}`:''}${a.endDate?` – ${A.esc(A.formatDate(a.endDate))}`:''}</p><div class="almanac-strip">${chips}</div><div class="record-actions">${actions}</div></section><section class="metrics"><div class="metric"><strong>${A.esc(value||'—')}</strong><span>${isSummit?'elevation':isRace?'result / distance':'headline metric'}</span></div><div class="metric"><strong>${a.distanceMi?A.esc(a.distanceMi)+' mi':'—'}</strong><span>recorded distance</span></div><div class="metric"><strong>${!isDownhill&&a.elevationGainM?A.fmt.format(Math.round(a.elevationGainM))+' m':'—'}</strong><span>${isDownhill?'pedaled gain not used':'recorded gain'}</span></div><div class="metric"><strong>${a.elapsedSeconds?A.esc(A.formatDuration(a.elapsedSeconds)):'—'}</strong><span>elapsed time</span></div></section><section class="profile"><div class="profile-copy"><p class="eyebrow">The record</p><h2>${A.esc(a.note||'A place, a date, and the effort behind it.')}</h2><div class="fact-list"><div class="fact"><small>Date</small><strong>${A.esc(A.formatDate(a.date)||String(a.year||'—'))}</strong></div><div class="fact"><small>Location</small><strong>${A.esc(a.location||'—')}</strong></div><div class="fact"><small>Type</small><strong>${A.esc(label)}</strong></div><div class="fact"><small>Collection</small><strong>${A.esc(groupFor(a).replace('-',' '))}</strong></div>${a.bib?`<div class="fact"><small>Bib</small><strong>${A.esc(a.bib)}</strong></div>`:''}${a.officialPlace?`<div class="fact"><small>Place</small><strong>${A.esc(a.officialPlace)}</strong></div>`:''}${a.eventSeries?`<div class="fact"><small>Series</small><strong>${A.esc(a.eventSeries)}</strong></div>`:''}${a.stravaActivityId?`<div class="fact"><small>Activity</small><strong>Strava ${A.esc(a.stravaActivityId)}</strong></div>`:''}</div></div><aside><p class="eyebrow">Context</p><div class="card"><p class="card-kicker">Archive position</p><h3>${idx+1} of ${ordered.length}</h3><p class="card-meta">Chronological position among ${A.esc(groupFor(a).replace('-',' '))} records currently in Adventures.</p></div></aside></section>${relatedSection}<section class="detail-route-section"><h2>${isSummit?'Recorded outing':'Course & location'}</h2><p id="routeMeta" class="card-meta">Loading route provenance…</p><div id="detailMap" class="detail-map" aria-label="Map for ${A.esc(a.name)}"></div></section>${chronology}`;renderRecordMap(a).finally(()=>{if(A.isProduction()&&/detail\.html$/.test(location.pathname)){history.replaceState(null,'',A.recordHref(a));A.refreshMeta(description)}})}).catch(e=>page.innerHTML=`<div class="empty">${A.esc(e.message)}</div>`);
</script></body></html>
