<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Opening Adventures… | Alex Ford</title><style>body{margin:0;background:#f7f4ee;color:#17202a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px}main{max-width:560px;text-align:center}p{color:#68737d;line-height:1.5}a{color:inherit;font-weight:700}</style></head><body><main><h1>Opening Adventures…</h1><p id="message">Resolving this route.</p><p><a id="home" href="index.html">Return home</a></p></main><script>
(()=>{const host=location.hostname;const path=location.pathname;const staging=host.endsWith('github.io');const base=staging?'/adventure-map/':'/';const rel=path.startsWith(base)?path.slice(base.length):path.replace(/^\//,'');const clean=rel.replace(/^\/+|\/+$/g,'');const record=clean.match(/^record\/([^/]+)$/);const routes={home:'index.html',overview:'index.html',map:'map.html',explore:'activities.html',activities:'activities.html',timeline:'timeline.html',races:'races.html',summits:'summits.html',skiing:'skiing.html',nordic:'nordic.html',mtb:'mountain-biking.html',stories:'adventures.html',adventures:'adventures.html'};let target='';if(record)target=`${base}detail.html?record=${encodeURIComponent(decodeURIComponent(record[1]))}`;else if(routes[clean])target=`${base}${routes[clean]}`;if(target){location.replace(target);return}document.getElementById('message').textContent='This Adventures route does not exist yet.';document.getElementById('home').href=`${base}index.html`;})();
</script></body></html>
